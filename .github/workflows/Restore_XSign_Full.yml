# Place this file at .github/workflows/Restore_XSign_Full.yml
# Required secret: RESTORE_TOKEN (Contents and Workflows: Read and write).
name: Restore Original XSign Into Repository Root
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xsign-original-restore-${{ github.ref }}
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check restoration credentials
        env:
          RESTORE_TOKEN: ${{ secrets.RESTORE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$RESTORE_TOKEN" ]; then
            echo '::error::Add repository Actions secret RESTORE_TOKEN from the new account. It needs Contents and Workflows read/write access to this repository.'
            exit 1
          fi
      - name: Checkout the selected destination branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RESTORE_TOKEN }}
          submodules: false
          fetch-depth: 1
      - name: Restore original files and both pinned libraries directly into root
        shell: bash
        run: |
          python3 - <<'RESTORE_ORIGINAL_XSIGN'
          from pathlib import Path, PurePosixPath
          from concurrent.futures import ThreadPoolExecutor
          import hashlib, io, json, os, stat, subprocess, tempfile, urllib.request, zipfile

          SOURCES = [
              {'name':'XSign','prefix':'','commit':'793ca4485371a1ac5efb8cf79a7e4dfe0e9c98ab','repo':'claration/feather','sha256':'8de837dc2c310fa8225c7351a1a6b6fe46dc952b273228b96dee76aef261c6ae','count':263},
              {'name':'IDeviceKitten','prefix':'IDeviceKitten/','commit':'837cf1e14d4875771dd5ee1b754a4c86215c5db3','repo':'claration/idevicekit','sha256':'e63af9ad39084d22a1aba44a56504a26afb843d42a2556407bf39416e3b27fef','count':25},
              {'name':'Zsign','prefix':'Zsign/','commit':'c4ba9da4283031c07efa03bce42c4b8602d22e73','repo':'claration/zsign','sha256':'a1a0f59f5c49acc8ab8e691d4a2dc029f4b885faceff9cd59bc5f15950bdafd3','count':247},
          ]

          def git(root, *args):
              return subprocess.check_output(['git','-C',str(root),*args])

          def load_archive(item, cache=None):
              if cache is not None:
                  raw=Path(cache[item['name']]).read_bytes()
              else:
                  url='https://codeload.github.com/'+item['repo']+'/zip/'+item['commit']
                  request=urllib.request.Request(url,headers={'User-Agent':'XSign-Original-Source-Restore'})
                  with urllib.request.urlopen(request,timeout=180) as response:
                      raw=response.read(150*1024*1024)
              if hashlib.sha256(raw).hexdigest()!=item['sha256']:
                  raise RuntimeError('Archive integrity failed: '+item['name'])
              result={}
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  if archive.testzip() is not None: raise RuntimeError('Damaged ZIP: '+item['name'])
                  roots={PurePosixPath(i.filename).parts[0] for i in archive.infolist()}
                  if len(roots)!=1: raise RuntimeError('Unexpected archive layout')
                  for info in archive.infolist():
                      path=PurePosixPath(info.filename)
                      if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(info.external_attr>>16):
                          raise RuntimeError('Invalid archive entry')
                      if info.is_dir(): continue
                      relative=PurePosixPath(*path.parts[1:]).as_posix()
                      name=item['prefix']+relative
                      if not relative or relative=='.' or name in result or '.git' in PurePosixPath(name).parts:
                          raise RuntimeError('Invalid source path')
                      data=archive.read(info)
                      if len(data)>=100*1024*1024: raise RuntimeError('File exceeds GitHub single-file limit')
                      mode=0o755 if info.external_attr>>16 & 0o111 else 0o644
                      result[name]=(data,mode)
              if len(result)!=item['count']: raise RuntimeError('Unexpected source-file count')
              return result

          def restore(root, output, cache=None):
              root=Path(root).resolve(); output=Path(output).resolve()
              with ThreadPoolExecutor(max_workers=3) as pool:
                  parts=list(pool.map(lambda item:load_archive(item,cache),SOURCES))
              files={}
              for part in parts:
                  if files.keys() & part.keys(): raise RuntimeError('Duplicate source paths')
                  files.update(part)
              required=['Feather/FeatherApp.swift','Feather.xcodeproj/project.pbxproj',
                        'Feather.xcworkspace/contents.xcworkspacedata','Makefile',
                        'AltSourceKit/Package.swift','NimbleKit/Package.swift',
                        'IDeviceKitten/Package.swift','Zsign/Package.swift','Zsign/src/bundle.cpp',
                        'Tools/Prepare_Zsign.py','.github/workflows/release.yml']
              if not all(p in files for p in required): raise RuntimeError('Required original project files missing')
              records=[{'path':p,'sha256':hashlib.sha256(b).hexdigest(),
                        'git_blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest(),
                        'mode':mode,'size':len(b)} for p,(b,mode) in sorted(files.items())]
              manifest={'source_commit':SOURCES[0]['commit'],'original_files':len(files),
                        'layout':'repository root','dependencies':'vendored pinned source',
                        'sources':SOURCES,'files':records}
              manifest_name='Tools/XSign_Restore_Manifest.json'
              files[manifest_name]=((json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode(),0o644)

              # Validate everything before writing. Initial GitHub repository templates may be replaced.
              bootstrap={'README.md','.gitignore','.gitattributes'}
              backups={}
              for name,(data,mode) in files.items():
                  target=root/name
                  if any(p.is_symlink() for p in [target,*target.parents]):
                      raise RuntimeError('Symlink blocks restoration: '+name)
                  for parent in target.parents:
                      if parent==root: break
                      if parent.exists() and not parent.is_dir(): raise RuntimeError('A file blocks source directory: '+name)
                  if target.exists():
                      if not target.is_file(): raise RuntimeError('Directory blocks source file: '+name)
                      if target.read_bytes()!=data:
                          if name not in bootstrap:
                              raise RuntimeError('Existing file differs; no files written: '+name+'. Use a new repository or review your existing edits.')
                          backups[name]=target.read_bytes()
              # An existing Git submodule index cannot be replaced implicitly by this restorer.
              index=git(root,'ls-files','--stage','-z').split(b'\0')
              if any(row.startswith(b'160000 ') for row in index if row):
                  raise RuntimeError('Existing submodule index found. Run this workflow in the new empty repository.')

              output.mkdir(parents=True,exist_ok=True)
              artifact=output/'XSign-original-source.zip'
              with zipfile.ZipFile(artifact,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for name,(data,mode) in sorted(files.items()):
                      info=zipfile.ZipInfo(name); info.external_attr=(stat.S_IFREG|mode)<<16
                      info.compress_type=zipfile.ZIP_DEFLATED; z.writestr(info,data)
              if backups:
                  with zipfile.ZipFile(output/'initial-template-backups.zip','w',zipfile.ZIP_DEFLATED) as z:
                      for name,data in backups.items():z.writestr(name,data)
              for name,(data,mode) in files.items():
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True)
                  if not target.exists() or target.read_bytes()!=data:target.write_bytes(data)
                  target.chmod(mode)
                  if hashlib.sha256(target.read_bytes()).digest()!=hashlib.sha256(data).digest():
                      raise RuntimeError('Restored-file verification failed: '+name)
              # Stage ignored dependency binaries as real files; avoid Git LFS/EOL rewriting their original bytes.
              attrs=Path(os.fsdecode(git(root,'rev-parse','--git-path','info/attributes')).strip())
              if not attrs.is_absolute():attrs=root/attrs
              attrs.parent.mkdir(parents=True,exist_ok=True)
              with attrs.open('a') as stream:stream.write('\n* -text -filter\n')
              pathlist=output/'restored-paths.nul'
              pathlist.write_bytes(b''.join(name.encode()+b'\0' for name in sorted(files)))
              git(root,'add','--force','--pathspec-from-file='+str(pathlist),'--pathspec-file-nul')
              staged={}
              for row in git(root,'ls-files','--stage','-z').split(b'\0'):
                  if not row:continue
                  meta,path=row.split(b'\t',1);mode,sha,stage=meta.split()
                  if stage!=b'0':raise RuntimeError('Unmerged index entry')
                  staged[path.decode()]=(mode.decode(),sha.decode())
              for name,(data,mode) in files.items():
                  digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  if staged.get(name)!=('100755' if mode==0o755 else '100644',digest):
                      raise RuntimeError('Git index verification failed: '+name)
              summary=os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary,'a',encoding='utf-8') as stream:
                      stream.write('# XSign original source restored\n\n535 original files restored directly in the repository root, including pinned Zsign and IDeviceKitten. Original Actions files restored. Source commit: `'+SOURCES[0]['commit']+'`.\n\nNo iOS build was run. This restores source files, not old GitHub secrets or the previous repository history.\n')
              print('Verified and staged',len(records),'original files directly in the repository root.')
              return manifest

          if __name__=='__main__':
              restore(Path.cwd(),Path(os.environ['RUNNER_TEMP'])/'xsign-restored-output')
          RESTORE_ORIGINAL_XSIGN
      - name: Save a downloadable source backup
        uses: actions/upload-artifact@v4
        with:
          name: XSign-original-source-and-tools
          path: ${{ runner.temp }}/xsign-restored-output/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Commit all restored source, libraries, and original workflow files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'Original source files are already restored.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore original XSign source and pinned signing libraries [skip ci]'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
