# Upload this file into .github/workflows/ in ipablack/X-SIGN. No PAT or Firebase credentials are inputs.
name: XSign Controlled Store and Verified Updates — iOS 15+
'on':
  workflow_dispatch:
    inputs:
      build_mode:
        description: production requires the live domain; development is for build verification only
        type: choice
        options:
        - production
        - development
        default: production
        required: true
permissions:
  contents: read
concurrency:
  group: xsign-controlled-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
    - name: Apply checked source update; preserve unknown changes
      shell: bash
      env:
        XSIGN_PAYLOAD_000: 
        XSIGN_PAYLOAD_001: 
        XSIGN_PAYLOAD_002: 
        XSIGN_PAYLOAD_003: 
        XSIGN_PAYLOAD_004: 
        XSIGN_PAYLOAD_005: 
        XSIGN_PAYLOAD_006: 
        XSIGN_PAYLOAD_007: 
        XSIGN_PAYLOAD_008: 
        XSIGN_PAYLOAD_009: 
        XSIGN_PAYLOAD_010: 
        XSIGN_PAYLOAD_011: 
        XSIGN_PAYLOAD_012: 
        XSIGN_PAYLOAD_013: 
        XSIGN_PAYLOAD_014: 
        XSIGN_PAYLOAD_015: 
        XSIGN_PAYLOAD_016: 
        XSIGN_PAYLOAD_017: 
        XSIGN_PAYLOAD_018: 
        XSIGN_PAYLOAD_019: 
        XSIGN_PAYLOAD_020: 
        XSIGN_PAYLOAD_021: 
        XSIGN_PAYLOAD_022: 
        XSIGN_PAYLOAD_023: 
        XSIGN_PAYLOAD_024: 
        XSIGN_PAYLOAD_025: 
        XSIGN_PAYLOAD_026: 
        XSIGN_PAYLOAD_027: 
        XSIGN_PAYLOAD_028: 
        XSIGN_PAYLOAD_029: 
        XSIGN_PAYLOAD_030: 
      run: |
        python3 - <<'XSIGN_REVIEWED_UPDATE'
        import os
        from pathlib import Path
        encoded=''.join(os.environ['XSIGN_PAYLOAD_%03d'%i] for i in range(31))
        installer_source='from pathlib import Path,PurePosixPath\nimport base64,hashlib,json,os,subprocess,zlib\nraw=zlib.decompress(base64.b64decode("""\nPAYLOAD\n"""))\nif hashlib.sha256(raw).hexdigest()!=\'0cc1da1c3a0eee958044b6a81356df50469c276c9b9a316e6970754bac8a0493\':raise SystemExit(\'Payload integrity failure\')\nrows=json.loads(raw);root=Path.cwd().resolve();ready=[];seen=set()\nfor row in rows:\n name=row[\'path\'];rel=PurePosixPath(name)\n if name in seen or rel.is_absolute() or \'..\' in rel.parts or not rel.parts or str(rel)!=name or rel.parts[0] not in [\'Feather\',\'Feather.xcodeproj\',\'Feather.xcworkspace\',\'NimbleKit\',\'AltSourceKit\',\'IDeviceKitten\',\'Zsign\',\'Tools\',\'DomainBackend\',\'Makefile\',\'public\']:\n  raise SystemExit(\'Invalid update path\')\n seen.add(name);target=root/name\n if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit(\'Symlink blocks update: \'+name)\n if target.exists() and not target.is_file():raise SystemExit(\'Invalid target: \'+name)\n data=row[\'text\'].encode() if row[\'text\'] is not None else None\n if (hashlib.sha256(data).hexdigest() if data is not None else None)!=row[\'after\']:raise SystemExit(\'Invalid target digest\')\n current=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None\n if current==row[\'after\']:continue\n if current not in row[\'before\']:raise SystemExit(\'Existing source differs; no files were changed: \'+name)\n ready.append((target,data))\nfor target,data in ready:\n if data is None:target.unlink()\n else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)\nstage=[r[\'path\'] for r in rows if (root/r[\'path\']).exists() or subprocess.run([\'git\',\'ls-files\',\'--error-unmatch\',\'--\',r[\'path\']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0]\n(Path(os.environ[\'RUNNER_TEMP\'])/\'xsign-secure-local-signing-paths.nul\').write_bytes(b\'\'.join(n.encode()+b\'\\0\' for n in stage))\nprint(\'Applied\',len(ready),\'reviewed updates. No workflow, website or credentials were overwritten.\')\n'
        installer_source=installer_source.replace('PAYLOAD',encoded)
        (Path(os.environ['RUNNER_TEMP'])/'apply-reviewed-update.py').write_text(installer_source)
        exec(compile(installer_source,'reviewed-update','exec'))
        XSIGN_REVIEWED_UPDATE
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify dashboard, backend and website-preserving merge
      shell: bash
      run: |
        set -euo pipefail
        {
          node Tools/Tests/xsign_studio_v2_checks.cjs
          node --test DomainBackend/tests/manifest.test.cjs
          python3 DomainBackend/tests/configure_test.py
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 -m compileall -q DomainBackend Tools/Tests
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-preflight.log"
    - uses: actions/upload-artifact@v4
      with:
        name: XSign-reviewed-installer
        path: ${{ runner.temp }}/apply-reviewed-update.py
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: XSign-Domain-and-Studio
        path: |-
          DomainBackend/
          Tools/XSign_Studio_v2.html
          Tools/Delivery/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14
    - name: Require live manifest service for production
      if: inputs.build_mode == 'production'
      shell: bash
      run: |
        set -euo pipefail
        python3 DomainBackend/verify.py 2>&1 | tee "$RUNNER_TEMP/xsign-local-domain-readiness.log"
    - name: Keep check logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: XSign-preflight-logs
        path: ${{ runner.temp }}/xsign-local-*.log
        if-no-files-found: ignore
        retention-days: 14
  build:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/download-artifact@v4
      with:
        name: XSign-reviewed-installer
        path: ${{ runner.temp }}/xsign-installer
    - name: Apply the identical reviewed source payload
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/xsign-installer/apply-reviewed-update.py"
    - name: Run Swift security, catalog policy, signing and transfer checks
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/prepare_source_selection_checks.py
          swiftc -swift-version 5 -parse-as-library "$RUNNER_TEMP/xsign-source-policy.swift" Feather/Utilities/XSignRESTSource.swift Feather/Utilities/XSignSourceAdapter.swift Feather/Utilities/XSignSelfUpdatePolicy.swift Tools/Tests/xsign_source_selection_checks.swift -o "$RUNNER_TEMP/xsign-source-checks"
          "$RUNNER_TEMP/xsign-source-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignCertificateSelection.swift Tools/Tests/xsign_certificate_selection_checks.swift -o "$RUNNER_TEMP/xsign-certificate-checks"
          "$RUNNER_TEMP/xsign-certificate-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignPrivateFiles.swift Tools/Tests/xsign_private_storage_checks.swift -o "$RUNNER_TEMP/xsign-private-storage-checks"
          "$RUNNER_TEMP/xsign-private-storage-checks"
          swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceOwnedStaging.swift Tools/Tests/xsign_owned_staging_checks.swift -o "$RUNNER_TEMP/xsign-staging-checks"
          "$RUNNER_TEMP/xsign-staging-checks"
          swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceFileTransfer.swift Tools/Tests/xsign_local_transfer_checks.swift -o "$RUNNER_TEMP/xsign-transfer-checks"
          "$RUNNER_TEMP/xsign-transfer-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignSelfUpdatePolicy.swift Tools/Tests/xsign_self_update_policy_checks.swift -o "$RUNNER_TEMP/xsign-self-update-checks"
          "$RUNNER_TEMP/xsign-self-update-checks"
          python3 Tools/Tests/make_self_update_key_fixture.py
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignSelfUpdateKey.swift Tools/Tests/xsign_self_update_key_checks.swift -o "$RUNNER_TEMP/xsign-self-update-key-checks"
          "$RUNNER_TEMP/xsign-self-update-key-checks"
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_options_compat.py
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 Tools/Tests/prepare_local_signing_server_checks.py
          python3 Tools/Tests/make_ota_tls_fixtures.py
          python3 Tools/Tests/make_ipa_security_fixtures.py
          XSIGN_OTA_TLS_FIXTURES="$RUNNER_TEMP/xsign-ota-tls-fixtures" XSIGN_IPA_FIXTURES="$RUNNER_TEMP/xsign-ipa-fixtures" swift run --package-path "$RUNNER_TEMP/xsign-local-server-checks" --jobs 2 XSignLocalServerChecks
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-checks.log"
    - name: Build and verify the iOS application
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild -version
        make 2>&1 | tee "$RUNNER_TEMP/xsign-local-build.log"
        python3 - <<'VERIFY_LOCAL_IPA'
        from pathlib import Path
        import zipfile,plistlib
        p=Path('packages/X-SIGN.ipa')
        with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert not any(n.lower().endswith(('.p12','.ipa')) for n in z.namelist()), 'Private signing keys or nested IPA must not be bundled'
            infos=[n for n in z.namelist() if n.startswith('Payload/') and n.count('/')==2 and n.endswith('/Info.plist')]
            assert len(infos)==1
            info_min=plistlib.loads(z.read(infos[0])).get('MinimumOSVersion','99.0')
            assert tuple(map(int,info_min.split('.'))) <= (15,0), 'IPA does not support iOS 15'
            assert plistlib.loads(z.read(infos[0])).get('UIFileSharingEnabled') is not True, 'File sharing must be disabled'
            info=plistlib.loads(z.read(infos[0]))
            executable=infos[0].rsplit('/',1)[0]+'/'+info['CFBundleExecutable']
            assert len(z.read(executable))>4096
        print('Verified the built IPA archive and app executable')
        VERIFY_LOCAL_IPA
    - name: Record build mode honestly
      env:
        XSIGN_BUILD_MODE: ${{ inputs.build_mode }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_MODE'
        from pathlib import Path
        import os
        mode=os.environ['XSIGN_BUILD_MODE']
        Path('packages/BUILD_MODE.txt').write_text('Build mode: '+mode+'\n'+('Domain readiness checked; physical-device verification still required.' if mode=='production' else 'DEVELOPMENT ONLY. Domain readiness was not checked. Not approved for installation rollout.')+'\n')
        PY_MODE
    - name: Upload the checked application
      uses: actions/upload-artifact@v4
      with:
        name: XSign-${{ inputs.build_mode }}-iOS15-IPA
        path: |-
          packages/X-SIGN.ipa
          packages/BUILD_MODE.txt
        if-no-files-found: error
        retention-days: 14
    - name: Save tested source changes to the selected branch
      shell: bash
      run: |
        set -euo pipefail
        git add -A --pathspec-from-file="$RUNNER_TEMP/xsign-secure-local-signing-paths.nul" --pathspec-file-nul
        if git diff --cached --quiet; then exit 0; fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'Connect managed sources, store layout and verified self-updates for iOS 15 [skip ci]'
        git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
    - name: Preserve native check and build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: XSign-native-logs
        path: ${{ runner.temp }}/xsign-local-*.log
        if-no-files-found: ignore
        retention-days: 14
