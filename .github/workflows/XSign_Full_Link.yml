    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Install locked dashboard test dependencies
      working-directory: Tools/StudioSource
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Verify dashboard, backend and website-preserving merge
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/check_workflow_consolidation.py
          python3 Tools/Tests/check_source_bootstrap.py
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_unified_contract.py
          python3 Tools/Tests/check_ipa_publisher.py
          python3 Tools/Tests/check_build_environment.py
          python3 Tools/Tests/check_ios_compatibility.py
          python3 Tools/Tests/check_identity.py
          node --test DomainBackend/tests/manifest.test.cjs
          python3 DomainBackend/tests/configure_test.py
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 -m compileall -q DomainBackend Tools/Tests
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-preflight.log"
    - name: Disable reviewed superseded workflows on the default branch
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Disable_Legacy_Workflows.py
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-reviewed-installer
        path: ${{ runner.temp }}/apply-reviewed-update.py
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-Unified-Panel-and-Source
        path: |-
          Tools/XSign_Studio.html
          Tools/StudioSource/src/
          Tools/StudioSource/scripts/
          Tools/StudioSource/tests/
          Tools/StudioSource/package*.json
          Tools/Integration/
          Tools/Delivery/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14
    - name: Check Feather manifest availability
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Verify_Feather_Manifest.py 2>&1 | tee "$RUNNER_TEMP/xsign-local-manifest.log"
    - name: Keep check logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: XSign-preflight-logs
        path: ${{ runner.temp }}/xsign-local-*.log
        if-no-files-found: ignore
        retention-days: 14
    permissions:
      contents: read
      actions: write
  build:
    needs: preflight
    runs-on: ${{ inputs.macos_runner || 'macos-15-intel' }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - uses: actions/download-artifact@v7
      with:
        name: XSign-reviewed-installer
        path: ${{ runner.temp }}/xsign-installer
    - name: Apply the identical reviewed source payload
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/xsign-installer/apply-reviewed-update.py"
    - name: Install locked dashboard dependencies on the macOS worker
      working-directory: Tools/StudioSource
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Select installed stable Xcode 26 and verify the iOS SDK
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Select_Xcode.py | tee "$RUNNER_TEMP/xsign-local-toolchain.log"
    - name: Build and verify the iOS application
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild -version
        export XSIGN_BUILD_NUMBER="${XSIGN_REQUESTED_BUILD:-${GITHUB_RUN_NUMBER:-1}}"
        python3 - <<'CHECK_BUILD'
        import os,re
        assert re.fullmatch(r'[1-9][0-9]{0,8}',os.environ['XSIGN_BUILD_NUMBER']), 'Use a positive numeric build number, at most 9 digits'
        CHECK_BUILD
        XSIGN_RELEASE_ORIGIN=$(python3 - <<'RELEASE_ORIGIN'
        import hashlib,os,urllib.parse
        value=os.environ.get('XSIGN_REQUESTED_RELEASE_URL','').strip()
        if value:
            p=urllib.parse.urlsplit(value)
            assert p.scheme=='https' and p.hostname and p.username is None and p.password is None and not p.fragment, 'Use the exact HTTPS manifest link without credentials or fragment'
            print(hashlib.sha256(value.encode()).hexdigest())
        RELEASE_ORIGIN
        )
        export XSIGN_RELEASE_ORIGIN
        export XSIGN_RESULT_BUNDLE="$RUNNER_TEMP/xsign-build.xcresult"
        make XSIGN_BUILD_NUMBER="$XSIGN_BUILD_NUMBER" XSIGN_RELEASE_ORIGIN="$XSIGN_RELEASE_ORIGIN" 2>&1 | tee "$RUNNER_TEMP/xsign-local-build.log"
        python3 - <<'VERIFY_LOCAL_IPA'
        from pathlib import Path
        import zipfile,plistlib,os
        p=Path('packages/X-SIGN.ipa')
        with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert not any(n.lower().endswith(('.p12','.ipa')) for n in z.namelist()), 'Private signing keys or nested IPA must not be bundled'
            infos=[n for n in z.namelist() if n.startswith('Payload/') and n.count('/')==2 and n.endswith('/Info.plist')]
            assert len(infos)==1
            info_min=plistlib.loads(z.read(infos[0])).get('MinimumOSVersion','99.0')
            minimum=tuple((list(map(int,info_min.split('.')))+[0,0])[:3])
            assert minimum <= (15,0,0), 'IPA does not support iOS 15'
            assert plistlib.loads(z.read(infos[0])).get('UIFileSharingEnabled') is not True, 'File sharing must be disabled'
            info=plistlib.loads(z.read(infos[0]))
            assert not any(n.startswith('Payload/') and n.endswith('/XSignInstall.html') for n in z.namelist()), 'Legacy installation page must not be bundled in the app'
            assert (info.get('XSignReleaseOrigin') or '')==os.environ['XSIGN_RELEASE_ORIGIN'], 'Unexpected release origin in app Info.plist'
            assert info.get('CFBundleIdentifier')=='com.ipablack.xsign', 'Unexpected XSign bundle identifier'
            assert info.get('CFBundleDisplayName')=='XSign' and info.get('CFBundleName')=='XSign', 'Unexpected app name'
            icons=info.get('CFBundleIcons',{}).get('CFBundlePrimaryIcon',{})
            assert icons.get('CFBundleIconName')=='AppIcon' or icons.get('CFBundleIconFiles'), 'Built app has no primary icon'
            assert str(info.get('CFBundleVersion')) == os.environ['XSIGN_BUILD_NUMBER'], 'IPA build does not match requested build'
            executable=infos[0].rsplit('/',1)[0]+'/'+info['CFBundleExecutable']
            assert len(z.read(executable))>4096
            assert info.get('CFBundleShortVersionString')=='1.0'
            assert str(info.get('CFBundleVersion')) == os.environ['XSIGN_BUILD_NUMBER']
        print('Verified the built IPA archive and app executable')
        VERIFY_LOCAL_IPA
      env:
        XSIGN_REQUESTED_BUILD: ${{ inputs.build_number }}
        XSIGN_REQUESTED_RELEASE_URL: ${{ inputs.release_url }}
    - name: Run Swift security, catalog policy, signing and transfer checks
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/prepare_source_selection_checks.py
          swiftc -swift-version 5 -parse-as-library "$RUNNER_TEMP/xsign-source-policy.swift" Feather/Utilities/XSignRESTSource.swift Feather/Utilities/XSignSourceAdapter.swift Feather/Utilities/XSignSelfUpdatePolicy.swift Tools/Tests/xsign_source_selection_checks.swift -o "$RUNNER_TEMP/xsign-source-checks"
          "$RUNNER_TEMP/xsign-source-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignCertificateSelection.swift Tools/Tests/xsign_certificate_selection_checks.swift -o "$RUNNER_TEMP/xsign-certificate-checks"
          "$RUNNER_TEMP/xsign-certificate-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignPrivateFiles.swift Tools/Tests/xsign_private_storage_checks.swift -o "$RUNNER_TEMP/xsign-private-storage-checks"
          "$RUNNER_TEMP/xsign-private-storage-checks"
          swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceOwnedStaging.swift Tools/Tests/xsign_owned_staging_checks.swift -o "$RUNNER_TEMP/xsign-staging-checks"
          "$RUNNER_TEMP/xsign-staging-checks"
          swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceFileTransfer.swift Tools/Tests/xsign_local_transfer_checks.swift -o "$RUNNER_TEMP/xsign-transfer-checks"
          "$RUNNER_TEMP/xsign-transfer-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignSelfUpdatePolicy.swift Tools/Tests/xsign_self_update_policy_checks.swift -o "$RUNNER_TEMP/xsign-self-update-checks"
          "$RUNNER_TEMP/xsign-self-update-checks"
          python3 Tools/Tests/make_self_update_key_fixture.py
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignSelfUpdateKey.swift Tools/Tests/xsign_self_update_key_checks.swift -o "$RUNNER_TEMP/xsign-self-update-key-checks"
          "$RUNNER_TEMP/xsign-self-update-key-checks"
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_options_compat.py
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignProvisioningProfile.swift Feather/Utilities/XSignBatchQueue.swift Tools/Tests/xsign_batch_profile_checks.swift -o "$RUNNER_TEMP/xsign-batch-profile-checks"
          "$RUNNER_TEMP/xsign-batch-profile-checks"
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 Tools/Tests/prepare_local_signing_server_checks.py
          python3 Tools/Tests/make_ipa_security_fixtures.py
          XSIGN_IPA_FIXTURES="$RUNNER_TEMP/xsign-ipa-fixtures" swift run --package-path "$RUNNER_TEMP/xsign-local-server-checks" --jobs 2 XSignLocalServerChecks
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-checks.log"

        swiftc -parse-as-library Feather/Utilities/XSignSearch.swift Feather/Utilities/XSignIPAProvider.swift Tools/Tests/xsign_appstore_provider_checks.swift -o "$RUNNER_TEMP/xsign-appstore-provider-checks"
        "$RUNNER_TEMP/xsign-appstore-provider-checks"
    - name: Record the source revision and exact build number
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_SCOPE'
        from pathlib import Path
        import hashlib, os, plistlib, zipfile
        package = Path('packages/X-SIGN.ipa')
        with zipfile.ZipFile(package) as archive:
            info = next(path for path in archive.namelist() if path.startswith('Payload/') and path.count('/') == 2 and path.endswith('/Info.plist'))
            bundle = plistlib.loads(archive.read(info))
        digest = hashlib.sha256()
        with package.open('rb') as source:
            for chunk in iter(lambda: source.read(1024 * 1024), b''):
                digest.update(chunk)
        checksum = digest.hexdigest()
        details = [
            'Original XSign interface reference: ipa-black/X-SIGN@793ca4485371a1ac5efb8cf79a7e4dfe0e9c98ab',
            f'App version: {bundle["CFBundleShortVersionString"]}',
            f'Build: {bundle["CFBundleVersion"]}',
            f'Workflow run: {os.environ["GITHUB_RUN_NUMBER"]} (attempt {os.environ["GITHUB_RUN_ATTEMPT"]})',
            f'Checkout: {os.environ["GITHUB_SHA"]}',
            f'IPA SHA-256: {checksum}',
            'Signing: embedded Zsign. Default installation manifest: Feather (api.palera.in).',
            'Verified in CI: Xcode build and automated checks. Physical iPhone installation remains a separate check.',
        ]
        report = '\n'.join(details) + '\n'
        Path('packages/BUILD_MODE.txt').write_text(report)
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('## XSign application verified\n\n' + '\n'.join('- ' + line for line in details) + '\n')
        XSIGN_SCOPE
    - name: Upload the checked application
      uses: actions/upload-artifact@v6
      with:
        name: XSign-1.0-Original-UI-${{ github.run_number }}-${{ github.run_attempt }}
        path: |-
          packages/X-SIGN.ipa
          packages/BUILD_MODE.txt
        if-no-files-found: error
        retention-days: 14
    - name: Save tested source changes to the selected branch
      shell: bash
      run: |
        set -euo pipefail
        git add -A --pathspec-from-file="$RUNNER_TEMP/xsign-secure-local-signing-paths.nul" --pathspec-file-nul
        if git diff --cached --quiet; then exit 0; fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'Restore original XSign storefront with verified local installation [skip ci]'
        git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
    - name: Summarize actual native errors
      if: failure()
      shell: bash
      run: |
        python3 - <<'XSIGN_NATIVE_ERRORS'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP'])
        errors=[]
        for name in ['xsign-local-toolchain.log','xsign-local-build.log','xsign-local-checks.log']:
            path=root/name
            if not path.is_file():continue
            for line in path.read_text(errors='replace').splitlines():
                if any(marker in line for marker in ['error:', 'fatal error:', 'No usable stable Xcode', '** BUILD FAILED **']):
                    if line not in errors:errors.append(line[:1800])
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
            output.write('## Native verification failed\n\n')
            output.write('\n'.join('    '+line for line in errors[:30]) if errors else 'Inspect the failing step and the XSign-native-logs artifact for the actual error.')
            output.write('\n\nFull native logs and the Xcode result bundle are preserved in XSign-native-logs. No app source is committed when verification fails.\n')
        XSIGN_NATIVE_ERRORS
    - name: Preserve native check and build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: XSign-native-logs
        path: |
          ${{ runner.temp }}/xsign-local-*.log
          ${{ runner.temp }}/xsign-build.xcresult
        if-no-files-found: ignore
        retention-days: 14
        include-hidden-files: true
  source-setup:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      XSIGN_CONTROL_TOKEN: ${{ secrets.XSIGN_CONTROL_TOKEN }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
    - uses: actions/download-artifact@v7
      with:
        name: XSign-reviewed-installer
        path: ${{ runner.temp }}/xsign-installer
    - name: Apply identical reviewed setup tools
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/xsign-installer/apply-reviewed-update.py"
    - name: Initialize source repository, publisher and Studio without losing apps
      if: env.XSIGN_CONTROL_TOKEN != ''
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Bootstrap_Source_Repository.py
    - name: Report missing cross-repository permission honestly
      if: env.XSIGN_CONTROL_TOKEN == ''
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_SETUP_NOTE'
        import os
        from pathlib import Path
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write('## Source repository: manual setup required\n\nThe app build succeeded; ipablack/repo was NOT changed because XSIGN_CONTROL_TOKEN is missing.\nAdd a token with Contents + Workflows write access to ipablack/repo as this repository secret and rerun to initialize repo.json, xsign-config.json, ipa_manager.yml and studio.html automatically.\nThe complete files are also in XSign-Unified-Panel-and-Source for manual installation.\nThe current website is not deployed by this workflow.\n')
        XSIGN_SETUP_NOTE
run-name: XSign 1.0 — original GitHub interface (run ${{ github.run_number }})
