# XSign application workflow
name: Xsign — Studio Release
run-name: XSign · ${{ github.event_name == 'repository_dispatch' && format('IPA check {0}', github.event.client_payload.request_id) || format('build {0}', github.run_number) }}
'on':
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - xsign-build.json
  repository_dispatch:
    types:
    - xsign-inspect-ipa
    - xsign-publish-ipa
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (github.event_name != 'repository_dispatch' || !github.event.repository.private)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
        persist-credentials: false
    - name: Apply reviewed XSign source
      shell: bash
      run: |
        python3 - <<'XSIGN_REVIEWED_UPDATE'
        import os
        from pathlib import Path
        encoded=''.join(os.environ['XSIGN_PAYLOAD_%03d'%i] for i in range(58)).replace(' ', '$')
        installer_source='"""Prepare missing XSign base files from a pinned public commit, without writing the app repo."""\nfrom pathlib import Path, PurePosixPath\nimport os\nimport subprocess\nimport tarfile\nimport tempfile\n\nXSIGN_BASE_COMMIT = \'84bb3b8f22ac07b963a5a4ef8ad38f3e44bb8ca8\'\nXSIGN_BASE_REPOSITORY = \'https://github.com/ipablack/X-SIGN.git\'\nXSIGN_BASE_MARKERS = (\'Feather/FeatherApp.swift\', \'Feather.xcodeproj/project.pbxproj\',\n                      \'Feather.xcworkspace/contents.xcworkspacedata\', \'NimbleKit/Package.swift\')\n\n\ndef prepare_reviewed_base(root):\n    if all((root / name).is_file() for name in XSIGN_BASE_MARKERS):\n        return {}\n    if os.environ.get(\'GITHUB_REPOSITORY\', \'\').lower() == \'ipablack/repo\':\n        raise SystemExit(\'Run the application workflow in X-SIGN, not in the catalogue repository; no files were changed.\')\n    temporary = Path(os.environ[\'RUNNER_TEMP\'])\n    with tempfile.TemporaryDirectory(prefix=\'xsign-base-\', dir=temporary) as folder:\n        folder = Path(folder)\n        cache = os.environ.get(\'XSIGN_BASE_CACHE\')\n        repository = Path(cache) if cache else folder / \'public.git\'\n        if not cache:\n            subprocess.run([\'git\', \'init\', \'--bare\', \'-q\', str(repository)], check=True)\n            subprocess.run([\'git\', \'-C\', str(repository), \'fetch\', \'--quiet\', \'--depth\', \'1\',\n                            XSIGN_BASE_REPOSITORY, XSIGN_BASE_COMMIT], check=True)\n        actual = subprocess.check_output([\'git\', \'-C\', str(repository), \'rev-parse\',\n                                          XSIGN_BASE_COMMIT + \'^{commit}\'], text=True).strip()\n        if actual != XSIGN_BASE_COMMIT:\n            raise SystemExit(\'The recovery commit does not match the reviewed source.\')\n        archive = folder / \'reviewed.tar\'\n        with archive.open(\'wb\') as output:\n            subprocess.run([\'git\', \'-C\', str(repository), \'archive\', \'--format=tar\', XSIGN_BASE_COMMIT],\n                           stdout=output, check=True)\n        result, size = {}, 0\n        with tarfile.open(archive) as source:\n            for item in source:\n                if item.isdir():\n                    continue\n                rel = PurePosixPath(item.name)\n                if rel.is_absolute() or \'..\' in rel.parts or not rel.parts or rel.parts[0] == \'.git\' or not item.isfile():\n                    raise SystemExit(\'An unsafe entry blocked source recovery.\')\n                # Keep the current workflow; old automatic patchers must not be restored.\n                if rel.parts[:2] == (\'.github\', \'workflows\'):\n                    continue\n                size += item.size\n                if item.size < 0 or size > 134_217_728:\n                    raise SystemExit(\'The recovery archive exceeds its reviewed size limit.\')\n                stream = source.extractfile(item)\n                if stream is None:\n                    raise SystemExit(\'A reviewed source file could not be read.\')\n                data = stream.read(item.size + 1)\n                if len(data) != item.size:\n                    raise SystemExit(\'An incomplete archive blocked source recovery.\')\n                result[str(rel)] = (data, item.mode & 0o777)\n        if not all(name in result for name in XSIGN_BASE_MARKERS):\n            raise SystemExit(\'The pinned archive does not contain the complete application base.\')\n        return result\n\nfrom pathlib import Path,PurePosixPath\nimport base64,hashlib,json,lzma\ndef decode91(data):\n alphabet=\'!#$%&()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]^_`abcdefghijklmnopqrstuvwxyz{|}~\';buffer=bits=0;value=-1;output=bytearray()\n for char in data:\n  digit=alphabet.index(char)\n  if value<0:value=digit\n  else:\n   value+=digit*91;buffer|=value<<bits;bits+=13 if (value&8191)>88 else 14\n   while bits>7:output.append(buffer&255);buffer>>=8;bits-=8\n   value=-1\n if value>=0:output.append((buffer|value<<bits)&255)\n return bytes(output)\nraw=lzma.decompress(decode91("""PAYLOAD"""),memlimit=67108864)\nif hashlib.sha256(raw).hexdigest()!=\'1448fdf4e595cc67d1e6dad5355eb33f410d8bee2f1e71486b887c1bcbbaf2c7\':raise SystemExit(\'Payload integrity failure\')\nlength=int.from_bytes(raw[:8],\'big\');rows=json.loads(raw[8:8+length]);hash_offset=8+length\nroot=Path.cwd().resolve();ready=[];seen=set()\nbaseline=prepare_reviewed_base(root);restored=[];row_paths={r[0] for r in rows}\nfor name,(data,mode) in baseline.items():\n target=root/name\n if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit(\'Symlink blocks recovery: \'+name)\n if target.exists() and not target.is_file():raise SystemExit(\'Invalid recovery target: \'+name)\n if name not in row_paths and not target.exists():restored.append((target,data,mode))\nfor name,content,encoding,hash_size,allow_missing,binary_size in rows:\n hashes=raw[hash_offset:hash_offset+hash_size];hash_offset+=hash_size\n if len(hashes)!=hash_size or hash_size%32:raise SystemExit(\'Invalid review hashes\')\n binary=raw[hash_offset:hash_offset+binary_size];hash_offset+=binary_size\n if len(binary)!=binary_size:raise SystemExit(\'Invalid image payload\')\n rel=PurePosixPath(name)\n if name in seen or rel.is_absolute() or \'..\' in rel.parts or not rel.parts or str(rel)!=name or rel.parts[0] not in [\'.gitignore\', \'AltSourceKit\', \'DomainBackend\', \'Feather\', \'Feather.xcconfig\', \'Feather.xcodeproj\', \'Feather.xcworkspace\', \'IDeviceKitten\', \'Makefile\', \'NimbleKit\', \'Tools\', \'Zsign\', \'firebase.json\', \'public\']:\n  raise SystemExit(\'Invalid update path\')\n seen.add(name);target=root/name\n if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit(\'Symlink blocks update: \'+name)\n if target.exists() and not target.is_file():raise SystemExit(\'Invalid target: \'+name)\n if encoding not in [\'utf-8\',\'base64\',\'binary\']:raise SystemExit(\'Invalid payload encoding\')\n data=binary if encoding==\'binary\' else (base64.b64decode(content,validate=True) if encoding==\'base64\' else content.encode()) if content is not None else None\n expected=hashlib.sha256(data).digest() if data is not None else None\n old=target.read_bytes() if target.exists() else baseline.get(name,(None,0))[0]\n current=hashlib.sha256(old).digest() if old is not None else None\n if current==expected:continue\n known=(hashes[i:i+32] for i in range(0,len(hashes),32))\n if not (allow_missing if current is None else current in known):\n  raise SystemExit(\'Existing source differs; no files were changed: \'+name)\n ready.append((target,data))\nfor target,data,mode in restored:\n target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(mode)\nfor target,data in ready:\n if data is None:\n  if target.exists():target.unlink()\n else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)\nprint(\'Applied\',len(ready),\'source updates and restored\',len(restored),\'base files.\')\n'
        installer_source=installer_source.replace('PAYLOAD',encoded)
        (Path(os.environ['RUNNER_TEMP'])/'apply-reviewed-update.py').write_text(installer_source)
        exec(compile(installer_source,'reviewed-update','exec'))
        XSIGN_REVIEWED_UPDATE
      env:
