# Canonical application workflow: .github/workflows/XSign_Full_Link.yml
# XSign 1.0: native app, Studio, sources and publisher share one reviewed payload.
name: XSign Unified 1.0 — App, Studio and IPA Publisher
'on':
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional positive build number; default is 1; increase it for later releases
        type: string
        required: false
        default: '1'
      macos_runner:
        description: Standard Intel macOS runner; use the other Intel image if a pool is unavailable
        type: choice
        required: false
        default: macos-15-intel
        options:
        - macos-15-intel
        - macos-26-intel
permissions:
  contents: read
concurrency:
  group: xsign-controlled-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
    - name: Apply checked source update; preserve unknown changes
      shell: bash
      run: |
        python3 - <<'XSIGN_REVIEWED_UPDATE'
        import os
        from pathlib import Path
        encoded=''.join(os.environ['XSIGN_PAYLOAD_%03d'%i] for i in range(53))
        installer_source='"""Prepare missing XSign base files from a pinned public commit, without writing the app repo."""\nfrom pathlib import Path, PurePosixPath\nimport os\nimport subprocess\nimport tarfile\nimport tempfile\n\nXSIGN_BASE_COMMIT = \'84bb3b8f22ac07b963a5a4ef8ad38f3e44bb8ca8\'\nXSIGN_BASE_REPOSITORY = \'https://github.com/ipablack/X-SIGN.git\'\nXSIGN_BASE_MARKERS = (\'Feather/FeatherApp.swift\', \'Feather.xcodeproj/project.pbxproj\',\n                      \'Feather.xcworkspace/contents.xcworkspacedata\', \'NimbleKit/Package.swift\')\n\n\ndef prepare_reviewed_base(root):\n    if all((root / name).is_file() for name in XSIGN_BASE_MARKERS):\n        return {}\n    if os.environ.get(\'GITHUB_REPOSITORY\', \'\').lower() == \'ipablack/repo\':\n        raise SystemExit(\'Run the application workflow in X-SIGN, not in the catalogue repository; no files were changed.\')\n    temporary = Path(os.environ[\'RUNNER_TEMP\'])\n    with tempfile.TemporaryDirectory(prefix=\'xsign-base-\', dir=temporary) as folder:\n        folder = Path(folder)\n        cache = os.environ.get(\'XSIGN_BASE_CACHE\')\n        repository = Path(cache) if cache else folder / \'public.git\'\n        if not cache:\n            subprocess.run([\'git\', \'init\', \'--bare\', \'-q\', str(repository)], check=True)\n            subprocess.run([\'git\', \'-C\', str(repository), \'fetch\', \'--quiet\', \'--depth\', \'1\',\n                            XSIGN_BASE_REPOSITORY, XSIGN_BASE_COMMIT], check=True)\n        actual = subprocess.check_output([\'git\', \'-C\', str(repository), \'rev-parse\',\n                                          XSIGN_BASE_COMMIT + \'^{commit}\'], text=True).strip()\n        if actual != XSIGN_BASE_COMMIT:\n            raise SystemExit(\'The recovery commit does not match the reviewed source.\')\n        archive = folder / \'reviewed.tar\'\n        with archive.open(\'wb\') as output:\n            subprocess.run([\'git\', \'-C\', str(repository), \'archive\', \'--format=tar\', XSIGN_BASE_COMMIT],\n                           stdout=output, check=True)\n        result, size = {}, 0\n        with tarfile.open(archive) as source:\n            for item in source:\n                if item.isdir():\n                    continue\n                rel = PurePosixPath(item.name)\n                if rel.is_absolute() or \'..\' in rel.parts or not rel.parts or rel.parts[0] == \'.git\' or not item.isfile():\n                    raise SystemExit(\'An unsafe entry blocked source recovery.\')\n                # Keep the current workflow; old automatic patchers must not be restored.\n                if rel.parts[:2] == (\'.github\', \'workflows\'):\n                    continue\n                size += item.size\n                if item.size < 0 or size > 134_217_728:\n                    raise SystemExit(\'The recovery archive exceeds its reviewed size limit.\')\n                stream = source.extractfile(item)\n                if stream is None:\n                    raise SystemExit(\'A reviewed source file could not be read.\')\n                data = stream.read(item.size + 1)\n                if len(data) != item.size:\n                    raise SystemExit(\'An incomplete archive blocked source recovery.\')\n                result[str(rel)] = (data, item.mode & 0o777)\n        if not all(name in result for name in XSIGN_BASE_MARKERS):\n            raise SystemExit(\'The pinned archive does not contain the complete application base.\')\n        return result\n\nfrom pathlib import Path,PurePosixPath\nimport base64,hashlib,json,os,subprocess,lzma\nraw=lzma.decompress(base64.b64decode("""PAYLOAD"""),memlimit=67108864)\nif hashlib.sha256(raw).hexdigest()!=\'78d5c1acf2867b252f526504efde196bcbe94ded199b0db84aa99ff8be9d58fe\':raise SystemExit(\'Payload integrity failure\')\nrows=json.loads(raw);root=Path.cwd().resolve();ready=[];seen=set()\nbaseline=prepare_reviewed_base(root);restored=[];row_paths={r[\'path\'] for r in rows}\nfor name,(data,mode) in baseline.items():\n target=root/name\n if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit(\'Symlink blocks recovery: \'+name)\n if target.exists() and not target.is_file():raise SystemExit(\'Invalid recovery target: \'+name)\n if name not in row_paths and not target.exists():restored.append((target,data,mode))\nfor row in rows:\n name=row[\'path\'];rel=PurePosixPath(name)\n if name in seen or rel.is_absolute() or \'..\' in rel.parts or not rel.parts or str(rel)!=name or rel.parts[0] not in [\'.gitignore\', \'AltSourceKit\', \'DomainBackend\', \'Feather\', \'Feather.xcconfig\', \'Feather.xcodeproj\', \'Feather.xcworkspace\', \'IDeviceKitten\', \'Makefile\', \'NimbleKit\', \'Tools\', \'Zsign\', \'public\']:\n  raise SystemExit(\'Invalid update path\')\n seen.add(name);target=root/name\n if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit(\'Symlink blocks update: \'+name)\n if target.exists() and not target.is_file():raise SystemExit(\'Invalid target: \'+name)\n encoding=row.get(\'encoding\',\'utf-8\')\n if encoding not in [\'utf-8\',\'base64\']:raise SystemExit(\'Invalid payload encoding\')\n data=(base64.b64decode(row[\'text\'],validate=True) if encoding==\'base64\' else row[\'text\'].encode()) if row[\'text\'] is not None else None\n if (hashlib.sha256(data).hexdigest() if data is not None else None)!=row[\'after\']:raise SystemExit(\'Invalid target digest\')\n old=target.read_bytes() if target.exists() else baseline.get(name,(None,0))[0]\n current=hashlib.sha256(old).hexdigest() if old is not None else None\n if current==row[\'after\']:continue\n if current not in row[\'before\']:raise SystemExit(\'Existing source differs; no files were changed: \'+name)\n ready.append((target,data))\nfor target,data,mode in restored:\n target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(mode)\nfor target,data in ready:\n if data is None:\n  if target.exists():target.unlink()\n else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)\nstage=[r[\'path\'] for r in rows if (root/r[\'path\']).exists() or subprocess.run([\'git\',\'ls-files\',\'--error-unmatch\',\'--\',r[\'path\']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0]\nstage+= [str(target.relative_to(root)) for target,_,_ in restored]\n(Path(os.environ[\'RUNNER_TEMP\'])/\'xsign-secure-local-signing-paths.nul\').write_bytes(b\'\'.join(n.encode()+b\'\\0\' for n in stage))\nprint(\'Applied\',len(ready),\'reviewed source updates and restored\',len(restored),\'missing base files. No workflow file, website deployment or credential was overwritten.\')\n'
        installer_source=installer_source.replace('PAYLOAD',encoded)
        (Path(os.environ['RUNNER_TEMP'])/'apply-reviewed-update.py').write_text(installer_source)
        exec(compile(installer_source,'reviewed-update','exec'))
        XSIGN_REVIEWED_UPDATE
      env:
        XSIGN_PAYLOAD_000: 
        XSIGN_PAYLOAD_001: 
        XSIGN_PAYLOAD_002: 
        XSIGN_PAYLOAD_003: 
        XSIGN_PAYLOAD_004: 
        XSIGN_PAYLOAD_005: 
        XSIGN_PAYLOAD_006: 
        XSIGN_PAYLOAD_007: 
        XSIGN_PAYLOAD_008: 
        XSIGN_PAYLOAD_009: 
        XSIGN_PAYLOAD_010: 
        XSIGN_PAYLOAD_011: 
        XSIGN_PAYLOAD_012: 
        XSIGN_PAYLOAD_013: 
        XSIGN_PAYLOAD_014: 
        XSIGN_PAYLOAD_015: 
        XSIGN_PAYLOAD_016: 
        XSIGN_PAYLOAD_017: 
        XSIGN_PAYLOAD_018: 
        XSIGN_PAYLOAD_019: 
        XSIGN_PAYLOAD_020: 
        XSIGN_PAYLOAD_021: 
        XSIGN_PAYLOAD_022: 
        XSIGN_PAYLOAD_023: 
        XSIGN_PAYLOAD_024: 
        XSIGN_PAYLOAD_025: 
        XSIGN_PAYLOAD_026: 
        XSIGN_PAYLOAD_027: 
        XSIGN_PAYLOAD_028: 
        XSIGN_PAYLOAD_029: 
        XSIGN_PAYLOAD_030: 
        XSIGN_PAYLOAD_031: 
        XSIGN_PAYLOAD_032: 
        XSIGN_PAYLOAD_033: 
        XSIGN_PAYLOAD_034: 
        XSIGN_PAYLOAD_035: 
        XSIGN_PAYLOAD_036: 
        XSIGN_PAYLOAD_037: 
        XSIGN_PAYLOAD_038: 
        XSIGN_PAYLOAD_039: 
        XSIGN_PAYLOAD_040: 
        XSIGN_PAYLOAD_041: 
        XSIGN_PAYLOAD_042: 
        XSIGN_PAYLOAD_043: 
        XSIGN_PAYLOAD_044: 
        XSIGN_PAYLOAD_045: 
        XSIGN_PAYLOAD_046: 
        XSIGN_PAYLOAD_047: 
        XSIGN_PAYLOAD_048: 
        XSIGN_PAYLOAD_049: 
        XSIGN_PAYLOAD_050: 
        XSIGN_PAYLOAD_051: 
        XSIGN_PAYLOAD_052: 
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Install locked dashboard test dependencies
      working-directory: Tools/StudioSource
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Verify dashboard, backend and website-preserving merge
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/check_workflow_consolidation.py
          python3 Tools/Tests/check_source_bootstrap.py
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_unified_contract.py
          python3 Tools/Tests/check_build_environment.py
          python3 Tools/Tests/check_ios_compatibility.py
          python3 Tools/Tests/check_identity.py
          node --test DomainBackend/tests/manifest.test.cjs
          python3 DomainBackend/tests/configure_test.py
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 -m compileall -q DomainBackend Tools/Tests
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-preflight.log"
    - name: Disable reviewed superseded workflows on the default branch
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Disable_Legacy_Workflows.py
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-reviewed-installer
        path: ${{ runner.temp }}/apply-reviewed-update.py
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-Unified-Panel-and-Source
        path: |-
          Tools/XSign_Studio.html
          Tools/StudioSource/src/
          Tools/StudioSource/scripts/
          Tools/StudioSource/tests/
          Tools/StudioSource/package*.json
          Tools/Integration/
          Tools/Delivery/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14
    - name: Diagnose Feather public service (availability is not a build result)
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Verify_Feather_Manifest.py 2>&1 | tee "$RUNNER_TEMP/xsign-local-feather-service.log"
    - name: Keep check logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: XSign-preflight-logs
        path: ${{ runner.temp }}/xsign-local-*.log
        if-no-files-found: ignore
        retention-days: 14
    permissions:
      contents: read
      actions: write
  build:
    needs: preflight
    runs-on: ${{ inputs.macos_runner || 'macos-15-intel' }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - uses: actions/download-artifact@v7
      with:
        name: XSign-reviewed-installer
        path: ${{ runner.temp }}/xsign-installer
    - name: Apply the identical reviewed source payload
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/xsign-installer/apply-reviewed-update.py"
    - name: Install locked dashboard dependencies on the macOS worker
      working-directory: Tools/StudioSource
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Select installed stable Xcode 26 and verify the iOS SDK
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Select_Xcode.py | tee "$RUNNER_TEMP/xsign-local-toolchain.log"
    - name: Build and verify the iOS application
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild -version
        export XSIGN_BUILD_NUMBER="${XSIGN_REQUESTED_BUILD:-1}"
        python3 - <<'CHECK_BUILD'
        import os,re
        assert re.fullmatch(r'[1-9][0-9]{0,8}',os.environ['XSIGN_BUILD_NUMBER']), 'Use a positive numeric build number, at most 9 digits'
        CHECK_BUILD
        export XSIGN_RESULT_BUNDLE="$RUNNER_TEMP/xsign-build.xcresult"
        make XSIGN_BUILD_NUMBER="$XSIGN_BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/xsign-local-build.log"
        python3 - <<'VERIFY_LOCAL_IPA'
        from pathlib import Path
        import zipfile,plistlib,os
        p=Path('packages/X-SIGN.ipa')
        with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            assert not any(n.lower().endswith(('.p12','.ipa')) for n in z.namelist()), 'Private signing keys or nested IPA must not be bundled'
            infos=[n for n in z.namelist() if n.startswith('Payload/') and n.count('/')==2 and n.endswith('/Info.plist')]
            assert len(infos)==1
            info_min=plistlib.loads(z.read(infos[0])).get('MinimumOSVersion','99.0')
            minimum=tuple((list(map(int,info_min.split('.')))+[0,0])[:3])
            assert minimum <= (15,0,0), 'IPA does not support iOS 15'
            assert plistlib.loads(z.read(infos[0])).get('UIFileSharingEnabled') is not True, 'File sharing must be disabled'
            info=plistlib.loads(z.read(infos[0]))
            assert info.get('CFBundleIdentifier')=='com.ipablack.xsign', 'Unexpected XSign bundle identifier'
            assert info.get('CFBundleDisplayName')=='XSign' and info.get('CFBundleName')=='XSign', 'Unexpected app name'
            icons=info.get('CFBundleIcons',{}).get('CFBundlePrimaryIcon',{})
            assert icons.get('CFBundleIconName')=='AppIcon' or icons.get('CFBundleIconFiles'), 'Built app has no primary icon'
            assert str(info.get('CFBundleVersion')) == os.environ['XSIGN_BUILD_NUMBER'], 'IPA build does not match requested build'
            executable=infos[0].rsplit('/',1)[0]+'/'+info['CFBundleExecutable']
            assert len(z.read(executable))>4096
            assert info.get('CFBundleShortVersionString')=='1.0'
            assert str(info.get('CFBundleVersion')) == os.environ['XSIGN_BUILD_NUMBER']
        print('Verified the built IPA archive and app executable')
        VERIFY_LOCAL_IPA
      env:
        XSIGN_REQUESTED_BUILD: ${{ inputs.build_number }}
    - name: Run Swift security, catalog policy, signing and transfer checks
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/prepare_source_selection_checks.py
          swiftc -swift-version 5 -parse-as-library "$RUNNER_TEMP/xsign-source-policy.swift" Feather/Utilities/XSignRESTSource.swift Feather/Utilities/XSignSourceAdapter.swift Feather/Utilities/XSignSelfUpdatePolicy.swift Tools/Tests/xsign_source_selection_checks.swift -o "$RUNNER_TEMP/xsign-source-checks"
          "$RUNNER_TEMP/xsign-source-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignCertificateSelection.swift Tools/Tests/xsign_certificate_selection_checks.swift -o "$RUNNER_TEMP/xsign-certificate-checks"
          "$RUNNER_TEMP/xsign-certificate-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignPrivateFiles.swift Tools/Tests/xsign_private_storage_checks.swift -o "$RUNNER_TEMP/xsign-private-storage-checks"
          "$RUNNER_TEMP/xsign-private-storage-checks"
          swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceOwnedStaging.swift Tools/Tests/xsign_owned_staging_checks.swift -o "$RUNNER_TEMP/xsign-staging-checks"
          "$RUNNER_TEMP/xsign-staging-checks"
          swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceFileTransfer.swift Tools/Tests/xsign_local_transfer_checks.swift -o "$RUNNER_TEMP/xsign-transfer-checks"
          "$RUNNER_TEMP/xsign-transfer-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignSelfUpdatePolicy.swift Tools/Tests/xsign_self_update_policy_checks.swift -o "$RUNNER_TEMP/xsign-self-update-checks"
          "$RUNNER_TEMP/xsign-self-update-checks"
          python3 Tools/Tests/make_self_update_key_fixture.py
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignSelfUpdateKey.swift Tools/Tests/xsign_self_update_key_checks.swift -o "$RUNNER_TEMP/xsign-self-update-key-checks"
          "$RUNNER_TEMP/xsign-self-update-key-checks"
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_options_compat.py
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 Tools/Tests/prepare_local_signing_server_checks.py
          python3 Tools/Tests/make_ota_tls_fixtures.py
          python3 Tools/Tests/make_ipa_security_fixtures.py
          XSIGN_OTA_TLS_FIXTURES="$RUNNER_TEMP/xsign-ota-tls-fixtures" XSIGN_IPA_FIXTURES="$RUNNER_TEMP/xsign-ipa-fixtures" swift run --package-path "$RUNNER_TEMP/xsign-local-server-checks" --jobs 2 XSignLocalServerChecks
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-checks.log"
    - name: Record actual verification scope
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_SCOPE'
        from pathlib import Path
        Path('packages/BUILD_MODE.txt').write_text('XSign 1.0: native signing + Feather Semi Local manifest service.\nThe app, Studio and publisher share the same reviewed source contract.\nXcode build and automated checks do not confirm physical-device installation.\n')
        XSIGN_SCOPE
    - name: Upload the checked application
      uses: actions/upload-artifact@v6
      with:
        name: XSign-1.0-Feather-Server-iOS15
        path: |-
          packages/X-SIGN.ipa
          packages/BUILD_MODE.txt
        if-no-files-found: error
        retention-days: 14
    - name: Save tested source changes to the selected branch
      shell: bash
      run: |
        set -euo pipefail
        git add -A --pathspec-from-file="$RUNNER_TEMP/xsign-secure-local-signing-paths.nul" --pathspec-file-nul
        if git diff --cached --quiet; then exit 0; fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'Connect full XSign native dashboard contract and verified IPA updates [skip ci]'
        git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
    - name: Summarize actual native errors
      if: failure()
      shell: bash
      run: |
        python3 - <<'XSIGN_NATIVE_ERRORS'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP'])
        errors=[]
        for name in ['xsign-local-toolchain.log','xsign-local-build.log','xsign-local-checks.log']:
            path=root/name
            if not path.is_file():continue
            for line in path.read_text(errors='replace').splitlines():
                if any(marker in line for marker in ['error:', 'fatal error:', 'No usable stable Xcode', '** BUILD FAILED **']):
                    if line not in errors:errors.append(line[:1800])
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
            output.write('## Native verification failed\n\n')
            output.write('\n'.join('    '+line for line in errors[:30]) if errors else 'Inspect the failing step and the XSign-native-logs artifact for the actual error.')
            output.write('\n\nFull native logs and the Xcode result bundle are preserved in XSign-native-logs. No app source is committed when verification fails.\n')
        XSIGN_NATIVE_ERRORS
    - name: Preserve native check and build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: XSign-native-logs
        path: |
          ${{ runner.temp }}/xsign-local-*.log
          ${{ runner.temp }}/xsign-build.xcresult
        if-no-files-found: ignore
        retention-days: 14
        include-hidden-files: true
  source-setup:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      XSIGN_CONTROL_TOKEN: ${{ secrets.XSIGN_CONTROL_TOKEN }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
    - uses: actions/download-artifact@v7
      with:
        name: XSign-reviewed-installer
        path: ${{ runner.temp }}/xsign-installer
    - name: Apply identical reviewed setup tools
      shell: bash
      run: |
        set -euo pipefail
        python3 "$RUNNER_TEMP/xsign-installer/apply-reviewed-update.py"
    - name: Initialize source repository, publisher and Studio without losing apps
      if: env.XSIGN_CONTROL_TOKEN != ''
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Bootstrap_Source_Repository.py
    - name: Report missing cross-repository permission honestly
      if: env.XSIGN_CONTROL_TOKEN == ''
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'XSIGN_SETUP_NOTE'
        import os
        from pathlib import Path
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write('## Source repository: manual setup required\n\nThe app build succeeded; ipablack/repo was NOT changed because XSIGN_CONTROL_TOKEN is missing.\nAdd a token with Contents + Workflows write access to ipablack/repo as this repository secret and rerun to initialize repo.json, xsign-config.json, ipa_manager.yml and studio.html automatically.\nThe complete files are also in XSign-Unified-Panel-and-Source for manual installation.\nThe current website is not deployed by this workflow.\n')
        XSIGN_SETUP_NOTE
