# XSign application workflow
name: Xsign — Studio Release
run-name: "XSign · ${{ inputs.apply_source && 'apply source' || format('build {0}', github.run_number) }}"
'on':
  workflow_dispatch:
    inputs:
      apply_source:
        description: Apply the XSign update to the repository without building an IPA
        type: boolean
        default: false
  push:
    branches:
    - main
    paths:
    - xsign-build.json
  repository_dispatch:
    types:
    - xsign-inspect-ipa
    - xsign-publish-ipa
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (github.event_name != 'repository_dispatch' || !github.event.repository.private) && (github.event_name != 'workflow_dispatch' || !inputs.apply_source)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Apply reviewed XSign source
      shell: bash
      run: |
        set -euo pipefail
        python3 -u - <<'XSIGN_SOURCE_UPDATE'
        import base64
        import hashlib
        import json
        import lzma
        import subprocess
        import sys
        from pathlib import Path, PurePosixPath

        def digest(path):
            return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None

        def local_path(name):
            relative = PurePosixPath(name)
            if relative.is_absolute() or str(relative) != name or ".." in relative.parts or not relative.parts:
                raise SystemExit(f"Invalid reviewed path: {name}")
            path = Path(name)
            if any(part.is_symlink() for part in (path, *path.parents)):
                raise SystemExit(f"Symlink blocks source verification: {name}")
            if path.exists() and not path.is_file():
                raise SystemExit(f"Invalid reviewed source: {name}")
            return path

        helper = local_path('XSign_Reviewed_Update.py')
        current_helper = 'f37476a63920c1a199ad5c45756076d7b1a593909debb94caefa5ebc570d1b44'
        workflow_file = Path('.github/workflows/XSign_Full_Link.yml')
        lines = workflow_file.read_text().splitlines()
        marker = '# xsign-source: '
        embedded = ''.join(line.removeprefix(marker) for line in lines if line.startswith(marker))
        if not embedded:
            if digest(helper) != current_helper:
                raise SystemExit('Add the matching XSign_Reviewed_Update.py at the repository root.')
            subprocess.run([sys.executable, '-u', str(helper)], check=True)
            sys.exit(0)

        payload = json.loads(lzma.decompress(base64.b64decode(embedded, validate=True), memlimit=64*1024*1024))
        basis = payload['basis']
        updates = payload['updates']

        def pending_changes():
            changes = []
            for name, accepted_versions, after in updates:
                path = local_path(name)
                current = digest(path)
                data = after.encode('utf-8')
                if current == hashlib.sha256(data).hexdigest():
                    continue
                # Always upgrade embedded reviewed source files cleanly regardless of prior patch revision.
                changes.append((path, data))
            return changes

        helper_hash = digest(helper)
        if any(digest(local_path(name)) != expected for name, expected in basis):
            if helper_hash != current_helper and helper_hash not in payload['previous_helpers']:
                raise SystemExit('This checkout requires the matching XSign_Reviewed_Update.py at the repository root.')
            subprocess.run([sys.executable, '-u', str(helper)], check=True)

        changes = pending_changes()
        for path, data in changes:
            path.write_bytes(data)
        print(f'Applied {len(changes)} embedded source updates.')
        XSIGN_SOURCE_UPDATE
      id: reviewed_source
    - name: Process protected IPA in private storage
      shell: bash
      if: github.event_name == 'repository_dispatch'
      env:
        XSIGN_CATALOG_REPOSITORY: ${{ secrets.XSIGN_IPA_STORAGE_REPOSITORY }}
        XSIGN_IPA_STORAGE_TOKEN: ${{ secrets.XSIGN_IPA_STORAGE_TOKEN }}
      run: |
        set -euo pipefail
        python3 Tools/XSign_Private_Queue.py
        echo "Private processing completed."
    - name: Install the pinned icon preparer
      shell: bash
      run: 'python3 -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0'
      if: github.event_name != 'repository_dispatch'
    - name: Read saved Studio settings and validate the selected runner
      shell: bash
      run: |
        set -euo pipefail
        {
          xsign_runner="${XSIGN_MACOS_RUNNER:-macos-26-intel}"
          case "$xsign_runner" in
            macos-26-intel|macos-15-intel) printf 'runner=%s\n' "$xsign_runner" >> "$GITHUB_OUTPUT" ;;
            *) printf '%s\n' '::error::XSIGN_MACOS_RUNNER must be macos-26-intel or macos-15-intel.'; exit 1 ;;
          esac
          python3 -u Tools/XSign_Release.py validate "$RUNNER_TEMP/xsign-build-settings.json"
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-settings.log"
      env:
        XSIGN_MACOS_RUNNER: ${{ vars.XSIGN_MACOS_RUNNER }}
        XSIGN_BUILD_REPO_PRIVATE: ${{ github.event.repository.private }}
        XSIGN_RELEASE_PUBLISH_READY: ${{ secrets.XSIGN_RELEASE_PUBLISH_TOKEN != '' }}
      if: github.event_name != 'repository_dispatch'
      id: release_settings
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
      if: github.event_name != 'repository_dispatch'
    - name: Install locked Studio dependencies
      working-directory: Tools/StudioSource
      run: npm ci --ignore-scripts --no-audit --no-fund
      if: github.event_name != 'repository_dispatch'
    - name: Generate Studio HTML from the reviewed source
      shell: bash
      run: |
        python3 Tools/StudioSource/scripts/build.py
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio.html
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio_v2.html
      if: github.event_name != 'repository_dispatch'
    - name: Verify dashboard, backend and website-preserving merge
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/check_workflow_consolidation.py
          python3 Tools/Tests/check_source_bootstrap.py
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_unified_contract.py
          python3 Tools/Tests/check_ipa_publisher.py
          python3 Tools/Tests/check_build_environment.py
          python3 Tools/Tests/check_ios_compatibility.py
          python3 Tools/Tests/check_identity.py
          node --test DomainBackend/tests/manifest.test.cjs DomainBackend/PushNotifications/functions/apns.test.cjs
          python3 DomainBackend/tests/configure_test.py
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 -m compileall -q DomainBackend Tools/Tests
          python3 Tools/Tests/check_xsign_release.py
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-preflight.log"
      if: github.event_name != 'repository_dispatch'
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-build-inputs
        path: |-
          ${{ runner.temp }}/xsign-build-settings.json
          ${{ runner.temp }}/xsign-build-icon.png
        if-no-files-found: error
        retention-days: 14
        overwrite: true
      if: github.event_name != 'repository_dispatch'
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-Studio
        path: Tools/XSign_Studio.html
        if-no-files-found: error
        retention-days: 14
        overwrite: true
      if: github.event_name != 'repository_dispatch'
    - name: Summarize Studio validation errors
      if: failure() && steps.reviewed_source.outcome == 'success'
      shell: bash
      run: |
        if compgen -G "$RUNNER_TEMP/xsign-local-*.log" > /dev/null; then
          python3 Tools/XSign_Release.py report-failure
        fi
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-preflight-logs
        path: ${{ runner.temp }}/xsign-local-*.log
        if-no-files-found: ignore
        retention-days: 14
        overwrite: true
      if: always()
      name: Preserve build settings and IPA verification logs
    name: XSign release checks
    outputs:
      runner: ${{ steps.release_settings.outputs.runner }}
      publish: ${{ steps.release_settings.outputs.publish }}
      owner_draft: ${{ steps.release_settings.outputs.owner_draft }}
      public_release: ${{ steps.release_settings.outputs.public_release }}
    concurrency:
      group: xsign-preflight-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.request_id || github.run_id }}
      cancel-in-progress: false
  build:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.runner }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - uses: actions/download-artifact@v7
      with:
        name: XSign-build-inputs
        path: ${{ runner.temp }}
    - name: Apply reviewed source to the macOS checkout
      shell: bash
      run: |
        set -euo pipefail
        python3 -u - <<'XSIGN_SOURCE_UPDATE'
        import base64
        import hashlib
        import json
        import lzma
        import subprocess
        import sys
        from pathlib import Path, PurePosixPath

        def digest(path):
            return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None

        def local_path(name):
            relative = PurePosixPath(name)
            if relative.is_absolute() or str(relative) != name or ".." in relative.parts or not relative.parts:
                raise SystemExit(f"Invalid reviewed path: {name}")
            path = Path(name)
            if any(part.is_symlink() for part in (path, *path.parents)):
                raise SystemExit(f"Symlink blocks source verification: {name}")
            if path.exists() and not path.is_file():
                raise SystemExit(f"Invalid reviewed source: {name}")
            return path

        helper = local_path('XSign_Reviewed_Update.py')
        current_helper = 'f37476a63920c1a199ad5c45756076d7b1a593909debb94caefa5ebc570d1b44'
        workflow_file = Path('.github/workflows/XSign_Full_Link.yml')
        lines = workflow_file.read_text().splitlines()
        marker = '# xsign-source: '
        embedded = ''.join(line.removeprefix(marker) for line in lines if line.startswith(marker))
        if not embedded:
            if digest(helper) != current_helper:
                raise SystemExit('Add the matching XSign_Reviewed_Update.py at the repository root.')
            subprocess.run([sys.executable, '-u', str(helper)], check=True)
            sys.exit(0)

        payload = json.loads(lzma.decompress(base64.b64decode(embedded, validate=True), memlimit=64*1024*1024))
        basis = payload['basis']
        updates = payload['updates']

        def pending_changes():
            changes = []
            for name, accepted_versions, after in updates:
                path = local_path(name)
                current = digest(path)
                data = after.encode('utf-8')
                if current == hashlib.sha256(data).hexdigest():
                    continue
                # Always upgrade embedded reviewed source files cleanly regardless of prior patch revision.
                changes.append((path, data))
            return changes

        helper_hash = digest(helper)
        if any(digest(local_path(name)) != expected for name, expected in basis):
            if helper_hash != current_helper and helper_hash not in payload['previous_helpers']:
                raise SystemExit('This checkout requires the matching XSign_Reviewed_Update.py at the repository root.')
            subprocess.run([sys.executable, '-u', str(helper)], check=True)

        changes = pending_changes()
        for path, data in changes:
            path.write_bytes(data)
        print(f'Applied {len(changes)} embedded source updates.')
        XSIGN_SOURCE_UPDATE
    - name: Install locked Studio dependencies
      working-directory: Tools/StudioSource
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Generate Studio HTML from the reviewed source
      shell: bash
      run: |
        python3 Tools/StudioSource/scripts/build.py
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio.html
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio_v2.html
    - name: Select installed stable Xcode 26 and verify the iOS SDK
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Select_Xcode.py | tee "$RUNNER_TEMP/xsign-local-toolchain.log"
    - name: Prepare ultra-light 0ms launch seed from live sources
      run: |
        python3 -u - <<'XSIGN_LAUNCH_SEED'
        import base64, json, re, urllib.request
        from pathlib import Path

        target_swift = Path('Feather/Views/Sources/SourcesView.swift')
        marker = 'private nonisolated static let bundledLaunchSeedPayloads: [String: String] = [:] // __XSIGN_BUNDLE_SEED__'
        if not target_swift.is_file() or marker not in target_swift.read_text(encoding='utf-8'):
            print('Launch seed marker not present; skipping.')
            raise SystemExit(0)

        urls = []
        def add_url(u):
            if isinstance(u, str) and u.startswith('https://') and 'raw.githubusercontent.com' not in u and u not in urls:
                urls.append(u)

        # 1. Read contract.json + its public_source_registry + repo.example.json + xsign-build.json
        contract_file = Path('Tools/Integration/contract.json')
        if contract_file.is_file():
            try:
                c = json.loads(contract_file.read_text(encoding='utf-8'))
                for u in (c.get('active_source_urls') or []) + (c.get('source_priority') or []):
                    add_url(u)
                reg_rel = c.get('public_source_registry')
                if isinstance(reg_rel, str) and Path(reg_rel).is_file():
                    reg = json.loads(Path(reg_rel).read_text(encoding='utf-8'))
                    for item in (reg.get('items') or []):
                        if isinstance(item, dict) and item.get('enabled') is not False:
                            add_url(item.get('url'))
            except Exception as exc:
                print('contract/registry parse note:', exc)

        for cfg_path in ('xsign-build.json', 'Tools/Delivery/repo.example.json'):
            p = Path(cfg_path)
            if not p.is_file():
                continue
            try:
                data = json.loads(p.read_text(encoding='utf-8'))
            except Exception:
                continue
            for s in (data.get('xsign_config', {}).get('dashboard', {}).get('sources', []) or []):
                if isinstance(s, dict) and s.get('enabled') is not False:
                    add_url(s.get('url'))
            for s in (data.get('xsign_config', {}).get('app_control', {}).get('core_sources', []) or []):
                if isinstance(s, dict):
                    add_url(s.get('url'))

        # 2. Scan XSignCatalogueEndpoint.swift for defaultCoreTargets HTTPS URLs (soonSnapshot, iosBoomCatalogue, etc.)
        ep_file = Path('Feather/Utilities/XSignCatalogueEndpoint.swift')
        if ep_file.is_file():
            ep_text = ep_file.read_text(encoding='utf-8', errors='replace')
            for m in re.findall(r'https://[A-Za-z0-9._~:/?#\[\]@!$&()*+,;=%-]+\.json', ep_text):
                add_url(m)

        print('Discovered seed candidate URLs:', urls)

        def compact_app(app):
            if not isinstance(app, dict):
                return None
            name = app.get('name') or ''
            bid = app.get('bundleIdentifier') or app.get('id') or ''
            if not name and not bid:
                return None
            out = {'name': str(name)[:120]}
            if bid: out['bundleIdentifier'] = str(bid)[:180]
            for k in ('catalogID', 'downloadURL', 'iconURL', 'version', 'size', 'category', 'artworkURL', 'isGame', 'skipAppStoreLookup', 'developerName'):
                v = app.get(k)
                if v is not None:
                    out[k] = v
            cats = app.get('categories')
            if isinstance(cats, list):
                out['categories'] = cats[:6]
            shots = app.get('screenshotURLs')
            if isinstance(shots, list):
                out['screenshotURLs'] = [s for s in shots[:2] if isinstance(s, str)]
            if isinstance(app.get('subtitle'), str):
                out['subtitle'] = app['subtitle'][:120]
            if isinstance(app.get('localizedDescription'), str):
                out['localizedDescription'] = app['localizedDescription'][:280]
            return out

        seeds = {}
        total_apps = 0
        total_bytes = 0
        for url in urls[:6]:
            try:
                req = urllib.request.Request(url, headers={'User-Agent': 'XSign-SeedBuilder/1.0'})
                with urllib.request.urlopen(req, timeout=12) as resp:
                    raw = resp.read(12 * 1024 * 1024)
                repo = json.loads(raw.decode('utf-8', errors='replace'))
                if not isinstance(repo, dict) or not isinstance(repo.get('apps'), list):
                    continue
                picked = []
                for a in repo['apps']:
                    c = compact_app(a)
                    if c:
                        picked.append(c)
                    if len(picked) >= 48:
                        break
                if not picked:
                    continue
                root = {'apps': picked}
                for k in ('name', 'identifier', 'subtitle', 'iconURL'):
                    if repo.get(k) is not None:
                        root[k] = repo[k]
                if isinstance(repo.get('featuredApps'), list):
                    root['featuredApps'] = repo['featuredApps'][:24]
                blob = json.dumps(root, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
                if len(blob) > 380_000:
                    root['apps'] = picked[:24]
                    blob = json.dumps(root, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
                if len(blob) <= 420_000:
                    seeds[url] = base64.b64encode(blob).decode('ascii')
                    total_apps += len(root['apps'])
                    total_bytes += len(blob)
            except Exception as exc:
                print(f'Skipping seed for {url}: {exc}')

        if seeds:
            entries = ',\n'.join(f'        {json.dumps(k)}: {json.dumps(v)}' for k, v in seeds.items())
            replacement = f'private nonisolated static let bundledLaunchSeedPayloads: [String: String] = [\n{entries}\n    ] // __XSIGN_BUNDLE_SEED__'
            text = target_swift.read_text(encoding='utf-8').replace(marker, replacement, 1)
            target_swift.write_text(text, encoding='utf-8')
            print(f'Embedded 0ms launch seed: {len(seeds)} sources, {total_apps} apps, {total_bytes/1024:.1f} KB total.')
        else:
            print('No live launch seeds fetched; keeping empty fallback.')
        XSIGN_LAUNCH_SEED
    - name: Build and verify the iOS application
      shell: bash
      run: |
        set -euo pipefail
        python3 -u Tools/XSign_Release.py build "$RUNNER_TEMP/xsign-build-settings.json" 2>&1 | tee "$RUNNER_TEMP/xsign-local-build.log"
      env:
        XSIGN_ORIGINAL_UI: ipa-black/X-SIGN@793ca4485371a1ac5efb8cf79a7e4dfe0e9c98ab
    - name: Record exact release settings and IPA fingerprint
      shell: bash
      run: |
        cat packages/BUILD_MODE.txt >> "$GITHUB_STEP_SUMMARY"
    - name: Run Swift security, catalog policy, signing and transfer checks
      shell: bash
      run: |
        set -euo pipefail
        bash Tools/Tests/check_native.sh 2>&1 | tee "$RUNNER_TEMP/xsign-local-checks.log"
    - name: Publish X-SIGN.ipa in build repository Releases
      if: needs.preflight.outputs.public_release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="xsign-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        gh release create "$tag" packages/X-SIGN.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "XSign · Build $GITHUB_RUN_NUMBER ($GITHUB_RUN_ATTEMPT)" --notes-file packages/BUILD_MODE.txt
        echo "[Download X-SIGN.ipa]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/X-SIGN.ipa)" >> "$GITHUB_STEP_SUMMARY"
    - name: Save personal IPA to an unpublished draft
      id: owner_release
      if: needs.preflight.outputs.owner_draft == 'true' && needs.preflight.outputs.publish == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="xsign-personal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        release=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$tag" -F draft=true)
        release_id=$(jq -er 'select(.draft == true) | .id | numbers' <<<"$release")
        asset=$(gh api --method POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=X-SIGN.ipa" -H 'Content-Type: application/octet-stream' --input packages/X-SIGN.ipa)
        bytes=$(wc -c < packages/X-SIGN.ipa)
        jq -e --argjson bytes "$bytes" 'select(.state == "uploaded" and .name == "X-SIGN.ipa" and .size == $bytes)' <<<"$asset" >/dev/null
        page=$(jq -er '.html_url' <<<"$release")
        echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
        echo "[Open your draft and download X-SIGN.ipa]($page)" >> "$GITHUB_STEP_SUMMARY"
    - name: Record the personal build reference
      if: needs.preflight.outputs.owner_draft == 'true' && needs.preflight.outputs.publish == 'false'
      uses: actions/upload-artifact@v6
      with:
        name: XSign-draft-${{ github.run_number }}-${{ github.run_attempt }}-${{ steps.owner_release.outputs.release_id }}
        path: packages/BUILD_MODE.txt
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-${{ needs.preflight.outputs.public_release == 'true' && 'release' || 'IPA' }}-${{ github.run_number }}-${{ github.run_attempt }}
        path: |-
          packages/X-SIGN.ipa
          packages/info.json
          packages/BUILD_MODE.txt
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
      name: Keep the verified X-SIGN.ipa and build report
      if: needs.preflight.outputs.owner_draft == 'false'
    - name: Publish verified IPA and activate mandatory update
      if: needs.preflight.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.XSIGN_RELEASE_PUBLISH_TOKEN }}
      run: |
        set -euo pipefail
        python3 -u Tools/XSign_Publish_Update.py
        echo 'Verified IPA and mandatory update policy are available.' >> "$GITHUB_STEP_SUMMARY"
    - name: Summarize actual native errors
      if: failure()
      shell: bash
      run: |
        python3 Tools/XSign_Release.py report-failure
    - name: Preserve native check and build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: XSign-native-logs
        path: |-
          ${{ runner.temp }}/xsign-local-*.log
          ${{ needs.preflight.outputs.owner_draft == 'false' && format('{0}/xsign-build.xcresult', runner.temp) || '' }}

          ${{ runner.temp }}/xsign-build-settings.json
          packages/BUILD_MODE.txt
        if-no-files-found: ignore
        retention-days: 14
        include-hidden-files: true
        overwrite: true
    if: github.event_name != 'repository_dispatch'
    permissions:
      contents: write
  apply_source:
    name: Apply source and Studio to the repository
    if: github.event_name == 'workflow_dispatch' && inputs.apply_source && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: xsign-apply-source-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: true
        submodules: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Apply reviewed XSign source
      shell: bash
      run: |
        set -euo pipefail
        python3 -u - <<'XSIGN_SOURCE_UPDATE'
        import base64
        import hashlib
        import json
        import lzma
        import subprocess
        import sys
        from pathlib import Path, PurePosixPath

        def digest(path):
            return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None

        def local_path(name):
            relative = PurePosixPath(name)
            if relative.is_absolute() or str(relative) != name or ".." in relative.parts or not relative.parts:
                raise SystemExit(f"Invalid reviewed path: {name}")
            path = Path(name)
            if any(part.is_symlink() for part in (path, *path.parents)):
                raise SystemExit(f"Symlink blocks source verification: {name}")
            if path.exists() and not path.is_file():
                raise SystemExit(f"Invalid reviewed source: {name}")
            return path

        helper = local_path('XSign_Reviewed_Update.py')
        current_helper = 'f37476a63920c1a199ad5c45756076d7b1a593909debb94caefa5ebc570d1b44'
        workflow_file = Path('.github/workflows/XSign_Full_Link.yml')
        lines = workflow_file.read_text().splitlines()
        marker = '# xsign-source: '
        embedded = ''.join(line.removeprefix(marker) for line in lines if line.startswith(marker))
        if not embedded:
            if digest(helper) != current_helper:
                raise SystemExit('Add the matching XSign_Reviewed_Update.py at the repository root.')
            subprocess.run([sys.executable, '-u', str(helper)], check=True)
            sys.exit(0)

        payload = json.loads(lzma.decompress(base64.b64decode(embedded, validate=True), memlimit=64*1024*1024))
        basis = payload['basis']
        updates = payload['updates']

        def pending_changes():
            changes = []
            for name, accepted_versions, after in updates:
                path = local_path(name)
                current = digest(path)
                data = after.encode('utf-8')
                if current == hashlib.sha256(data).hexdigest():
                    continue
                # Always upgrade embedded reviewed source files cleanly regardless of prior patch revision.
                changes.append((path, data))
            return changes

        helper_hash = digest(helper)
        if any(digest(local_path(name)) != expected for name, expected in basis):
            if helper_hash != current_helper and helper_hash not in payload['previous_helpers']:
                raise SystemExit('This checkout requires the matching XSign_Reviewed_Update.py at the repository root.')
            subprocess.run([sys.executable, '-u', str(helper)], check=True)

        changes = pending_changes()
        for path, data in changes:
            path.write_bytes(data)
        print(f'Applied {len(changes)} embedded source updates.')
        XSIGN_SOURCE_UPDATE
    - name: Stage reviewed application files
      shell: bash
      run: git add -A
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Install locked Studio dependencies
      working-directory: Tools/StudioSource
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Generate Studio HTML from the reviewed source
      shell: bash
      run: |
        python3 Tools/StudioSource/scripts/build.py
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio.html
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio_v2.html
    - name: Install the pinned icon preparer
      shell: bash
      run: 'python3 -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0'
    - name: Verify dashboard, backend and website-preserving merge
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/check_workflow_consolidation.py
          python3 Tools/Tests/check_source_bootstrap.py
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_unified_contract.py
          python3 Tools/Tests/check_ipa_publisher.py
          python3 Tools/Tests/check_build_environment.py
          python3 Tools/Tests/check_ios_compatibility.py
          python3 Tools/Tests/check_identity.py
          node --test DomainBackend/tests/manifest.test.cjs DomainBackend/PushNotifications/functions/apns.test.cjs
          python3 DomainBackend/tests/configure_test.py
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 -m compileall -q DomainBackend Tools/Tests
          python3 Tools/Tests/check_xsign_release.py
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-preflight.log"
    - name: Commit and push to the selected branch
      shell: bash
      run: |
        set -euo pipefail
        git add -- Tools/XSign_Studio.html Tools/XSign_Studio_v2.html
        git diff --cached --check
        if git diff --cached --quiet; then
          echo 'XSign source already matches this update.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if ! git diff --cached --quiet -- .github/workflows xsign-build.json; then
          echo '::error::Unexpected changes to workflows or the saved release request.'
          exit 1
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'Apply XSign source and Studio update'
        git push origin "HEAD:$GITHUB_REF"
        printf 'XSign source and Studio committed to %s (%s).\n' "$GITHUB_REF_NAME" "$(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

