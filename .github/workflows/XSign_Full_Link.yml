    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: xsign-apply-source-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        persist-credentials: true
        submodules: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
