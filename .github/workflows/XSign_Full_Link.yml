# Canonical application workflow: .github/workflows/XSign_Full_Link.yml
# XSign 1.0: native app, Studio, sources and publisher share one reviewed payload.
name: XSign Unified 1.0 — App, Studio and IPA Publisher
'on':
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional positive build number; default is 1; increase it for later releases
        type: string
        required: false
        default: '1'
      macos_runner:
        description: Standard Intel macOS runner; use the other Intel image if a pool is unavailable
        type: choice
        required: false
        default: macos-15-intel
        options:
        - macos-15-intel
        - macos-26-intel
      release_url:
        description: Optional exact HTTPS manifest URL for an already signed forced update. Leave empty for verified IPA updates.
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: xsign-controlled-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
    - name: Apply checked source update; preserve unknown changes
      shell: bash
      run: |
        python3 - <<'XSIGN_REVIEWED_UPDATE'
        import os
        from pathlib import Path
        encoded=''.join(os.environ['XSIGN_PAYLOAD_%03d'%i] for i in range(58))
        installer_source='"""Prepare missing XSign base files from a pinned public commit, without writing the app repo."""\nfrom pathlib import Path, PurePosixPath\nimport os\nimport subprocess\nimport tarfile\nimport tempfile\n\nXSIGN_BASE_COMMIT = \'84bb3b8f22ac07b963a5a4ef8ad38f3e44bb8ca8\'\nXSIGN_BASE_REPOSITORY = \'https://github.com/ipablack/X-SIGN.git\'\nXSIGN_BASE_MARKERS = (\'Feather/FeatherApp.swift\', \'Feather.xcodeproj/project.pbxproj\',\n                      \'Feather.xcworkspace/contents.xcworkspacedata\', \'NimbleKit/Package.swift\')\n\n\ndef prepare_reviewed_base(root):\n    if all((root / name).is_file() for name in XSIGN_BASE_MARKERS):\n        return {}\n    if os.environ.get(\'GITHUB_REPOSITORY\', \'\').lower() == \'ipablack/repo\':\n        raise SystemExit(\'Run the application workflow in X-SIGN, not in the catalogue repository; no files were changed.\')\n    temporary = Path(os.environ[\'RUNNER_TEMP\'])\n    with tempfile.TemporaryDirectory(prefix=\'xsign-base-\', dir=temporary) as folder:\n        folder = Path(folder)\n        cache = os.environ.get(\'XSIGN_BASE_CACHE\')\n        repository = Path(cache) if cache else folder / \'public.git\'\n        if not cache:\n            subprocess.run([\'git\', \'init\', \'--bare\', \'-q\', str(repository)], check=True)\n            subprocess.run([\'git\', \'-C\', str(repository), \'fetch\', \'--quiet\', \'--depth\', \'1\',\n                            XSIGN_BASE_REPOSITORY, XSIGN_BASE_COMMIT], check=True)\n        actual = subprocess.check_output([\'git\', \'-C\', str(repository), \'rev-parse\',\n                                          XSIGN_BASE_COMMIT + \'^{commit}\'], text=True).strip()\n        if actual != XSIGN_BASE_COMMIT:\n            raise SystemExit(\'The recovery commit does not match the reviewed source.\')\n        archive = folder / \'reviewed.tar\'\n        with archive.open(\'wb\') as output:\n            subprocess.run([\'git\', \'-C\', str(repository), \'archive\', \'--format=tar\', XSIGN_BASE_COMMIT],\n                           stdout=output, check=True)\n        result, size = {}, 0\n        with tarfile.open(archive) as source:\n            for item in source:\n                if item.isdir():\n                    continue\n                rel = PurePosixPath(item.name)\n                if rel.is_absolute() or \'..\' in rel.parts or not rel.parts or rel.parts[0] == \'.git\' or not item.isfile():\n                    raise SystemExit(\'An unsafe entry blocked source recovery.\')\n                # Keep the current workflow; old automatic patchers must not be restored.\n                if rel.parts[:2] == (\'.github\', \'workflows\'):\n                    continue\n                size += item.size\n                if item.size < 0 or size > 134_217_728:\n                    raise SystemExit(\'The recovery archive exceeds its reviewed size limit.\')\n                stream = source.extractfile(item)\n                if stream is None:\n                    raise SystemExit(\'A reviewed source file could not be read.\')\n                data = stream.read(item.size + 1)\n                if len(data) != item.size:\n                    raise SystemExit(\'An incomplete archive blocked source recovery.\')\n                result[str(rel)] = (data, item.mode & 0o777)\n        if not all(name in result for name in XSIGN_BASE_MARKERS):\n            raise SystemExit(\'The pinned archive does not contain the complete application base.\')\n        return result\n\nfrom pathlib import Path,PurePosixPath\nimport base64,hashlib,json,os,subprocess,lzma\nraw=lzma.decompress(base64.b85decode("""PAYLOAD"""),memlimit=67108864)\nif hashlib.sha256(raw).hexdigest()!=\'a1b2001a17dcdb33c90dee7d908a72be335f997a3085cba7774fd3d71b5df445\':raise SystemExit(\'Payload integrity failure\')\nrows=json.loads(raw);root=Path.cwd().resolve();ready=[];seen=set()\nbaseline=prepare_reviewed_base(root);restored=[];row_paths={r[\'path\'] for r in rows}\nfor name,(data,mode) in baseline.items():\n target=root/name\n if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit(\'Symlink blocks recovery: \'+name)\n if target.exists() and not target.is_file():raise SystemExit(\'Invalid recovery target: \'+name)\n if name not in row_paths and not target.exists():restored.append((target,data,mode))\nfor row in rows:\n name=row[\'path\'];rel=PurePosixPath(name)\n if name in seen or rel.is_absolute() or \'..\' in rel.parts or not rel.parts or str(rel)!=name or rel.parts[0] not in [\'.gitignore\', \'AltSourceKit\', \'DomainBackend\', \'Feather\', \'Feather.xcconfig\', \'Feather.xcodeproj\', \'Feather.xcworkspace\', \'IDeviceKitten\', \'Makefile\', \'NimbleKit\', \'Tools\', \'Zsign\', \'firebase.json\', \'public\']:\n  raise SystemExit(\'Invalid update path\')\n seen.add(name);target=root/name\n if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit(\'Symlink blocks update: \'+name)\n if target.exists() and not target.is_file():raise SystemExit(\'Invalid target: \'+name)\n encoding=row.get(\'encoding\',\'utf-8\')\n if encoding not in [\'utf-8\',\'base64\']:raise SystemExit(\'Invalid payload encoding\')\n data=(base64.b64decode(row[\'text\'],validate=True) if encoding==\'base64\' else row[\'text\'].encode()) if row[\'text\'] is not None else None\n if (hashlib.sha256(data).hexdigest() if data is not None else None)!=row[\'after\']:raise SystemExit(\'Invalid target digest\')\n old=target.read_bytes() if target.exists() else baseline.get(name,(None,0))[0]\n current=hashlib.sha256(old).hexdigest() if old is not None else None\n if current==row[\'after\']:continue\n if current not in row[\'before\']:raise SystemExit(\'Existing source differs; no files were changed: \'+name)\n ready.append((target,data))\nfor target,data,mode in restored:\n target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(mode)\nfor target,data in ready:\n if data is None:\n  if target.exists():target.unlink()\n else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)\nstage=[r[\'path\'] for r in rows if (root/r[\'path\']).exists() or subprocess.run([\'git\',\'ls-files\',\'--error-unmatch\',\'--\',r[\'path\']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0]\nstage+= [str(target.relative_to(root)) for target,_,_ in restored]\n(Path(os.environ[\'RUNNER_TEMP\'])/\'xsign-secure-local-signing-paths.nul\').write_bytes(b\'\'.join(n.encode()+b\'\\0\' for n in stage))\nprint(\'Applied\',len(ready),\'reviewed source updates and restored\',len(restored),\'missing base files. No workflow file, website deployment or credential was overwritten.\')\n'
        installer_source=installer_source.replace('PAYLOAD',encoded)
        (Path(os.environ['RUNNER_TEMP'])/'apply-reviewed-update.py').write_text(installer_source)
        exec(compile(installer_source,'reviewed-update','exec'))
        XSIGN_REVIEWED_UPDATE
