!So6U1E9{%_G<+K8Wf>).%w1bkOZh=);;opK2-omEu?WhZtHvipDWO}=hb75u*50H_nYm?IK@TZ0Bt^e7H<`>Sco1PuU;`5E=cexPqbNPN5P1Xvu&Zoi.(%%DyMgMC}qJS.oEp#`Pr&4@S(3kNRt#4u0FCKGB%7k>mw(6@NjaBjyXk.XuYw;We#Fs*?ZuLE`7ihywR<MWBNlG{C?Ov>a_BTFej|}a)=F+tr@nHT|HcOqb_s#n4i&`|(5h7m|feJGJ3tE`+aE#LkYpd&m^ouT_Q-}RFcd5?%XT`EPO<9z79m27&N1;+CE>H06lE#>4iGe2gcUkyW`(F=(wGz+R;|kMfBY&cE7ygp5C4S4;`ccIB!P4l!e@|%WzRx+d*LfsUZW(SRK-tdd6raE)t{8OeO;B%-xznHYby9)t#?Kh8zy7=;*Bs<n?*(`{;LT(qhw2Xqs@EZX.}ctTv^U)fsbgRF.@>GDfMoUsz<p~|r^HyLSqx<x9A#C-p37x}m0kVH;_k?vR0+j!pobs4.`b`knphHXQIPQid>wgh)d<mEo>pZ%B#Sn^OXkGyueE~J{Gb2;qwmwa{C+dV00EQZ7MY@IF3>fBvBYQl0ssI200dcD
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Read release identity and SHA-256
      shell: bash
      run: |
        set -euo pipefail
        python3 -u Tools/XSign_Release.py inspect "$RUNNER_TEMP/xsign-release-info.json" 2>&1 | tee "$RUNNER_TEMP/xsign-local-inspection.log"
        python3 - <<'PYTHON'
        from pathlib import Path
        import base64, os
        report = (Path(os.environ['RUNNER_TEMP']) / 'xsign-release-info.json').read_bytes()
        print('::notice title=XSign IPA metadata::XSIGN_IPA_METADATA=' + base64.urlsafe_b64encode(report).decode())
        PYTHON
      if: github.event_name == 'repository_dispatch'
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-release-metadata
        path: ${{ runner.temp }}/xsign-release-info.json
        if-no-files-found: error
        retention-days: 14
        overwrite: true
      if: github.event_name == 'repository_dispatch'
    - name: Install the pinned icon preparer
      shell: bash
      run: 'python3 -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0'
      if: github.event_name != 'repository_dispatch'
    - name: Read saved Studio settings and validate the selected runner
      shell: bash
      run: |
        set -euo pipefail
        {
          xsign_runner="${XSIGN_MACOS_RUNNER:-macos-26-intel}"
          case "$xsign_runner" in
            macos-26-intel|macos-15-intel) printf 'runner=%s\n' "$xsign_runner" >> "$GITHUB_OUTPUT" ;;
            *) printf '%s\n' '::error::XSIGN_MACOS_RUNNER must be macos-26-intel or macos-15-intel.'; exit 1 ;;
          esac
          python3 -u Tools/XSign_Release.py validate "$RUNNER_TEMP/xsign-build-settings.json"
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-settings.log"
      env:
        XSIGN_MACOS_RUNNER: ${{ vars.XSIGN_MACOS_RUNNER }}
      if: github.event_name != 'repository_dispatch'
      id: release_settings
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
      if: github.event_name != 'repository_dispatch'
    - name: Install locked Studio dependencies
      working-directory: Tools/StudioSource
      run: npm ci --ignore-scripts --no-audit --no-fund
      if: github.event_name != 'repository_dispatch'
    - name: Generate Studio HTML from the reviewed source
      shell: bash
      run: |
        python3 Tools/StudioSource/scripts/build.py
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio.html
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio_v2.html
      if: github.event_name != 'repository_dispatch'
    - name: Verify dashboard, backend and website-preserving merge
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/check_workflow_consolidation.py
          python3 Tools/Tests/check_source_bootstrap.py
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_unified_contract.py
          python3 Tools/Tests/check_ipa_publisher.py
          python3 Tools/Tests/check_build_environment.py
          python3 Tools/Tests/check_ios_compatibility.py
          python3 Tools/Tests/check_identity.py
          node --test DomainBackend/tests/manifest.test.cjs
          python3 DomainBackend/tests/configure_test.py
          python3 Tools/Tests/check_zsign_provisioning.py
          python3 -m compileall -q DomainBackend Tools/Tests
          python3 Tools/Tests/check_xsign_release.py
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-preflight.log"
      if: github.event_name != 'repository_dispatch'
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-build-inputs
        path: |-
          ${{ runner.temp }}/apply-reviewed-update.py
          ${{ runner.temp }}/xsign-build-settings.json
          ${{ runner.temp }}/xsign-build-icon.png
        if-no-files-found: error
        retention-days: 14
        overwrite: true
      if: github.event_name != 'repository_dispatch'
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-Studio
        path: Tools/XSign_Studio.html
        if-no-files-found: error
        retention-days: 14
        overwrite: true
      if: github.event_name != 'repository_dispatch'
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-preflight-logs
        path: ${{ runner.temp }}/xsign-local-*.log
        if-no-files-found: ignore
        retention-days: 14
        overwrite: true
      if: always()
      name: Preserve build settings and IPA verification logs
    name: XSign release checks
    outputs:
      runner: ${{ steps.release_settings.outputs.runner }}
  build:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.runner }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        submodules: false
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v5
      with:
        node-version: '22'
    - uses: actions/download-artifact@v7
      with:
        name: XSign-build-inputs
        path: ${{ runner.temp }}
    - name: Apply reviewed source to the macOS checkout
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/apply-reviewed-update.py"
    - name: Install locked Studio dependencies
      working-directory: Tools/StudioSource
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Generate Studio HTML from the reviewed source
      shell: bash
      run: |
        python3 Tools/StudioSource/scripts/build.py
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio.html
        cp Tools/StudioSource/dist/index.html Tools/XSign_Studio_v2.html
    - name: Select installed stable Xcode 26 and verify the iOS SDK
      shell: bash
      run: |
        set -euo pipefail
        python3 Tools/Select_Xcode.py | tee "$RUNNER_TEMP/xsign-local-toolchain.log"
    - name: Build and verify the iOS application
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 -u Tools/XSign_Release.py build "$RUNNER_TEMP/xsign-build-settings.json"
        } 2>&1 | tee "$RUNNER_TEMP/xsign-local-build.log"
      env:
        XSIGN_ORIGINAL_UI: ipa-black/X-SIGN@793ca4485371a1ac5efb8cf79a7e4dfe0e9c98ab
    - name: Record exact release settings and IPA fingerprint
      shell: bash
      run: |
        cat packages/BUILD_MODE.txt >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v6
      with:
        name: XSign-IPA-${{ github.run_number }}-${{ github.run_attempt }}
        path: |-
          packages/X-SIGN.ipa
          packages/info.json
          packages/BUILD_MODE.txt
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
      name: Keep the verified X-SIGN.ipa and build report
    - name: Run Swift security, catalog policy, signing and transfer checks
      shell: bash
      run: |
        set -euo pipefail
        {
          python3 Tools/Tests/prepare_source_selection_checks.py
          swiftc -swift-version 5 -parse-as-library "$RUNNER_TEMP/xsign-source-policy.swift" Feather/Utilities/XSignRESTSource.swift Feather/Utilities/XSignSourceAdapter.swift Feather/Utilities/XSignSelfUpdatePolicy.swift AltSourceKit/Sources/AltSourceKit/Models/ASRepository.swift AltSourceKit/Sources/AltSourceKit/Extensions/Array/Array+safe.swift AltSourceKit/Sources/AltSourceKit/Extensions/Color/Color+Codable.swift Tools/Tests/xsign_source_selection_checks.swift -o "$RUNNER_TEMP/xsign-source-checks"
          "$RUNNER_TEMP/xsign-source-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignCertificateSelection.swift Tools/Tests/xsign_certificate_selection_checks.swift -o "$RUNNER_TEMP/xsign-certificate-checks"
          "$RUNNER_TEMP/xsign-certificate-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignPrivateFiles.swift Tools/Tests/xsign_private_storage_checks.swift -o "$RUNNER_TEMP/xsign-private-storage-checks"
          "$RUNNER_TEMP/xsign-private-storage-checks"
          swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceOwnedStaging.swift Tools/Tests/xsign_owned_staging_checks.swift -o "$RUNNER_TEMP/xsign-staging-checks"
          "$RUNNER_TEMP/xsign-staging-checks"
          swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceFileTransfer.swift Tools/Tests/xsign_local_transfer_checks.swift -o "$RUNNER_TEMP/xsign-transfer-checks"
          "$RUNNER_TEMP/xsign-transfer-checks"
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignSelfUpdatePolicy.swift Tools/Tests/xsign_self_update_policy_checks.swift -o "$RUNNER_TEMP/xsign-self-update-checks"
          "$RUNNER_TEMP/xsign-self-update-checks"
          python3 Tools/Tests/make_self_update_key_fixture.py
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignSelfUpdateKey.swift Tools/Tests/xsign_self_update_key_checks.swift -o "$RUNNER_TEMP/xsign-self-update-key-checks"
          "$RUNNER_TEMP/xsign-self-update-key-checks"
          node Tools/Tests/xsign_studio_v2_checks.cjs
          python3 Tools/Tests/check_options_compat.py
          swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignProvisioningProfile.swift Feather/Utilities/XSignBatchQueue.swift Tools/Tests/xsign_batch_profile_checks.swift -o "$RUNNER_TEMP/xsign-batch-profile-checks"
          "$RUNNER_TEMP/xsign-batch-profile-checks"
