        if hashlib.sha256(raw).hexdigest() != "06f3cfc323f62f62cf30c3347c4abe476dc9db6de65713e67fe567de8f269abd": raise SystemExit("Invalid update payload")
        rows=json.loads(raw)
        root=Path.cwd().resolve()
        ready=[]
        seen=set()
        for row in rows:
            name=row['path']; rel=PurePosixPath(name)
            if name in seen or rel.is_absolute() or '..' in rel.parts or not rel.parts or str(rel)!=name or rel.parts[0] not in ['Feather','IDeviceKitten','Zsign','Tools','Makefile','public','Feather.xcodeproj','Feather.xcworkspace','DomainBackend']:
                raise SystemExit('Invalid update path')
            seen.add(name)
            target=root/name
            if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit('Symlink blocks update: '+name)
            if target.exists() and not target.is_file():raise SystemExit('Invalid target: '+name)
            data=row['text'].encode() if row['text'] is not None else None
            if (hashlib.sha256(data).hexdigest() if data is not None else None)!=row['after']:raise SystemExit('Invalid target digest')
            current=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
            if current==row['after']:continue
            if current not in row['before']:raise SystemExit('Existing source differs; no files were changed: '+name)
            ready.append((target,data))
        for target,data in ready:
            if data is None:target.unlink()
            else:
                target.parent.mkdir(parents=True,exist_ok=True)
                target.write_bytes(data)
        output=Path(os.environ['RUNNER_TEMP'])/'xsign-secure-local-signing-paths.nul'
        stage_paths=[row['path'] for row in rows if (root/row['path']).exists() or subprocess.run(['git','ls-files','--error-unmatch','--',row['path']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0]
        output.write_bytes(b''.join(name.encode()+b'\0' for name in stage_paths))
        print('Applied',len(ready),'reviewed updates to original app files and DomainBackend; no workflows or existing Firebase website files were changed.')
        XSIGN_OTA_UPDATE
    - name: Auto-link firebase.json, functions_xsign_ota, and repository catalog files
      shell: bash
      run: |
        python3 - <<'XSIGN_AUTO_LINK'
        from pathlib import Path
        import base64, json, os, shutil, subprocess, urllib.error, urllib.request

        root = Path.cwd().resolve()
        runner_temp = Path(os.environ.get("RUNNER_TEMP", "/tmp")).resolve()
        runner_temp.mkdir(parents=True, exist_ok=True)

        default_project_id = "xsign-bd088"
        default_site_id = "x-sign"
        project_id = (
            os.environ.get("INPUT_FIREBASE_PROJECT_ID", "").strip()
            or os.environ.get("FIREBASE_PROJECT_ID", "").strip()
        )
        site_id = (
            os.environ.get("INPUT_FIREBASE_SITE_ID", "").strip()
            or os.environ.get("FIREBASE_SITE_ID", "").strip()
            or default_site_id
        )
        sa_out = runner_temp / "xsign-gcp-sa.json"
        redacted_files = []

        # 1. Check workflow input or environment secrets for Service Account JSON or token
        raw_cred_input = (
            os.environ.get("INPUT_FIREBASE_CREDENTIALS_JSON", "").strip()
            or os.environ.get("FIREBASE_SERVICE_ACCOUNT", "").strip()
            or os.environ.get("GOOGLE_APPLICATION_CREDENTIALS_JSON", "").strip()
        )
        if raw_cred_input.startswith("{"):
            try:
                cred_obj = json.loads(raw_cred_input)
                if isinstance(cred_obj, dict) and cred_obj.get("type") == "service_account" and cred_obj.get("private_key"):
                    sa_out.write_text(json.dumps(cred_obj, ensure_ascii=False), encoding="utf-8")
                    os.chmod(sa_out, 0o600)
                    if not project_id and cred_obj.get("project_id"):
                        project_id = str(cred_obj["project_id"]).strip()
            except Exception:
                pass
        elif raw_cred_input and not os.environ.get("FIREBASE_TOKEN"):
            os.environ["FIREBASE_TOKEN"] = raw_cred_input
            env_file = os.environ.get("GITHUB_ENV")
            if env_file:
                with open(env_file, "a", encoding="utf-8") as ef:
                    ef.write(f"FIREBASE_TOKEN={raw_cred_input}\n")

        # 2. Inspect candidate files in repository root (e.g. if user uploaded Service Account key as firebase.json)
        candidate_sa_files = [
            root / "service-account.json",
            root / "firebase-service-account.json",
            *sorted(root.glob("*firebase-adminsdk*.json")),
            root / "firebase.json",
        ]
        for cand in candidate_sa_files:
            if not cand.is_file() or cand.is_symlink():
                continue
            try:
                obj = json.loads(cand.read_text(encoding="utf-8"))
            except Exception:
                continue
            if isinstance(obj, dict) and obj.get("type") == "service_account" and obj.get("private_key"):
                sa_out.write_text(json.dumps(obj, ensure_ascii=False), encoding="utf-8")
                os.chmod(sa_out, 0o600)
                if not project_id and obj.get("project_id"):
                    project_id = str(obj["project_id"]).strip()
                rel_name = cand.relative_to(root).as_posix()
                redacted_files.append(rel_name)
                cand.unlink()
                print(f"Detected Service Account key in {rel_name}; moved to runner temp and removed from working tree.")

        # 3. Inspect .firebaserc if present
        firebaserc_path = root / ".firebaserc"
        if firebaserc_path.is_file() and not firebaserc_path.is_symlink():
            try:
                rc = json.loads(firebaserc_path.read_text(encoding="utf-8"))
                if not project_id:
                    project_id = str(rc.get("projects", {}).get("default", "")).strip()
            except Exception:
                pass

        # 4. Inspect or initialize firebase.json for Hosting + Functions
        fb_path = root / "firebase.json"
        fb_config = None
        if fb_path.is_file() and not fb_path.is_symlink():
            try:
                fb_config = json.loads(fb_path.read_text(encoding="utf-8"))
            except Exception as exc:
                raise SystemExit(f"Invalid JSON in firebase.json: {exc}")

        if isinstance(fb_config, dict) and "hosting" not in fb_config:
            if not project_id and fb_config.get("projectId"):
                project_id = str(fb_config["projectId"]).strip()
            auth_domain = str(fb_config.get("authDomain", "")).strip()
            if auth_domain.endswith(".web.app") or auth_domain.endswith(".firebaseapp.com"):
                inferred_site = auth_domain.split(".")[0].strip()
                if inferred_site:
                    site_id = inferred_site
            fb_config = None

        if not project_id:
            project_id = default_project_id

        if not isinstance(fb_config, dict):
            fb_config = {
                "hosting": [
                    {
                        "site": site_id,
                        "public": "public",
                        "cleanUrls": True,
                        "rewrites": [{"source": "**", "destination": "/index.html"}],
                    }
                ]
            }
        else:
            hosting = fb_config.get("hosting")
            if isinstance(hosting, dict):
                if not hosting.get("site") and not hosting.get("target"):
                    hosting["site"] = site_id
                if not hosting.get("public") and not hosting.get("source"):
                    hosting["public"] = "public"
            elif isinstance(hosting, list):
                selected = [h for h in hosting if isinstance(h, dict) and (h.get("site") in ("x-sign", site_id) or h.get("target") == "xsign")]
                if not selected:
                    if len(hosting) == 1 and isinstance(hosting[0], dict) and not hosting[0].get("site") and not hosting[0].get("target"):
                        hosting[0]["site"] = site_id
                        if not hosting[0].get("public") and not hosting[0].get("source"):
                            hosting[0]["public"] = "public"
                    else:
                        hosting.append({
                            "site": site_id,
                            "public": "public",
                            "cleanUrls": True,
                            "rewrites": [{"source": "**", "destination": "/index.html"}],
                        })
                else:
                    for h in selected:
                        if not h.get("public") and not h.get("source"):
                            h["public"] = "public"
            else:
                fb_config["hosting"] = [
                    {
                        "site": site_id,
                        "public": "public",
                        "cleanUrls": True,
                        "rewrites": [{"source": "**", "destination": "/index.html"}],
                    }
                ]

        hosts = fb_config["hosting"] if isinstance(fb_config["hosting"], list) else [fb_config["hosting"]]
        matched = [h for h in hosts if isinstance(h, dict) and (h.get("site") == "x-sign" or h.get("target") == "xsign")]
        if not matched and hosts and isinstance(hosts[0], dict):
            if hosts[0].get("site") and hosts[0].get("site") != "x-sign":
                hosts[0]["target"] = "xsign"
            else:
                hosts[0]["site"] = "x-sign"
            matched = [hosts[0]]

        public_dir_name = matched[0].get("public") or matched[0].get("source") or "public"
        public_dir = root / public_dir_name
        public_dir.mkdir(parents=True, exist_ok=True)
        index_html = public_dir / "index.html"
        if not index_html.exists():
            fetched = None
            for url in [f"https://{site_id}.web.app/", "https://x-sign.web.app/"]:
                try:
                    req = urllib.request.Request(url, headers={"User-Agent": "XSign-Workflow-Preserver/1.0"})
                    with urllib.request.urlopen(req, timeout=8) as resp:
                        if resp.status == 200:
                            body = resp.read(262144)
                            if b"<html" in body.lower() or b"<!doctype" in body.lower():
                                fetched = body
                                break
                except Exception:
                    pass
            if fetched:
                index_html.write_bytes(fetched)
                print(f"Preserved live homepage into {public_dir_name}/index.html")
            else:
                index_html.write_text(
                    "<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>XSign</title></head>\n"
                    "<body style=\"background:#0b0f19;color:#f8fafc;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;\">\n"
                    "<div style=\"text-align:center;padding:24px;\"><h1 style=\"margin:0 0 8px;\">XSign</h1><p style=\"opacity:0.8;margin:0;\">خدمة التثبيت المحلي المباشر (OTA Manifest Service) جاهزة.</p></div>\n"
                    "</body>\n</html>\n",
                    encoding="utf-8",
                )

        fb_path.write_text(json.dumps(fb_config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

        # 5. Merge XSign OTA routes & functions_xsign_ota codebase via DomainBackend/configure.py
        import importlib.util
        spec = importlib.util.spec_from_file_location("configure", root / "DomainBackend" / "configure.py")
        mod = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(mod)
        mod.configure(root)

        backup = root / "firebase.before-xsign-ota.json"
        if backup.exists():
            backup.unlink()

        fn_gitignore = root / "functions_xsign_ota" / ".gitignore"
        fn_gitignore.write_text("node_modules/\n.env*\n*.log\n", encoding="utf-8")

        # 6. Ensure .firebaserc maps project + hosting target
        rc_data = {"projects": {"default": project_id}, "targets": {project_id: {"hosting": {"xsign": [site_id]}}}}
        if firebaserc_path.is_file() and not firebaserc_path.is_symlink():
            try:
                existing_rc = json.loads(firebaserc_path.read_text(encoding="utf-8"))
                if isinstance(existing_rc, dict):
                    existing_rc.setdefault("projects", {})["default"] = project_id
                    existing_rc.setdefault("targets", {}).setdefault(project_id, {}).setdefault("hosting", {})["xsign"] = [site_id]
                    rc_data = existing_rc
            except Exception:
                pass
        firebaserc_path.write_text(json.dumps(rc_data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

        # 7. Place repo.json and XSign_Studio.html at repo root and public/ for easy linking
        tools_repo = root / "Tools" / "repo.json"
        tools_studio = root / "Tools" / "XSign_Studio_v2.html"
        root_repo = root / "repo.json"
        root_studio = root / "XSign_Studio.html"
        public_studio = public_dir / "XSign_Studio.html"
        if tools_repo.is_file() and not root_repo.exists():
            shutil.copyfile(tools_repo, root_repo)
        if tools_studio.is_file():
            shutil.copyfile(tools_studio, root_studio)
            shutil.copyfile(tools_studio, public_studio)

        # 8. Append linked files to xsign-secure-local-signing-paths.nul so git commits them cleanly
        nul_file = runner_temp / "xsign-secure-local-signing-paths.nul"
        existing_paths = []
        if nul_file.is_file():
            existing_paths = [p.decode("utf-8") for p in nul_file.read_bytes().split(b"\0") if p]
        extra_paths = [
            "firebase.json",
            ".firebaserc",
            "repo.json",
            "XSign_Studio.html",
            f"{public_dir_name}/index.html",
            f"{public_dir_name}/XSign_Studio.html",
            "functions_xsign_ota/core.cjs",
            "functions_xsign_ota/index.cjs",
            "functions_xsign_ota/package.json",
            "functions_xsign_ota/.gitignore",
        ]
        for ep in extra_paths:
            if (root / ep).is_file() and ep not in existing_paths:
                existing_paths.append(ep)
        nul_file.write_bytes(b"".join(p.encode("utf-8") + b"\0" for p in existing_paths))

        if redacted_files:
            (runner_temp / "xsign-redacted-files.txt").write_text("\n".join(redacted_files) + "\n", encoding="utf-8")

        env_file = os.environ.get("GITHUB_ENV")
        if env_file:
            with open(env_file, "a", encoding="utf-8") as ef:
                ef.write(f"XSIGN_FIREBASE_PROJECT_ID={project_id}\n")
                ef.write(f"XSIGN_FIREBASE_SITE_ID={site_id}\n")
                if sa_out.is_file():
                    ef.write(f"GOOGLE_APPLICATION_CREDENTIALS={sa_out}\n")

        print(f"Linked firebase.json (project={project_id}, site={site_id}), functions_xsign_ota, and repo.json.")
        XSIGN_AUTO_LINK
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Test the domain service and merged Firebase configuration
      shell: bash
      run: |
        set -euo pipefail
        {
          node --test DomainBackend/tests/manifest.test.cjs
          python3 DomainBackend/tests/configure_test.py
          python3 -m compileall -q DomainBackend
          npm --prefix functions_xsign_ota install --no-audit --no-fund
          git diff --check
        } 2>&1 | tee "$RUNNER_TEMP/xsign-domain-checks.log"
    - name: Auto-deploy DomainBackend to Firebase (when credentials or token are present)
      shell: bash
      run: |
        set -euo pipefail
        {
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Firebase credentials detected; configuring secret and deploying xsign-ota to project ${XSIGN_FIREBASE_PROJECT_ID}..."
            if ! npx -y firebase-tools functions:secrets:access XSIGN_OTA_MANIFEST_KEY --project "${XSIGN_FIREBASE_PROJECT_ID}" >/dev/null 2>&1; then
              key_file="$(mktemp)"
              openssl rand -hex 32 > "$key_file"
              npx -y firebase-tools functions:secrets:set XSIGN_OTA_MANIFEST_KEY --data-file "$key_file" --project "${XSIGN_FIREBASE_PROJECT_ID}" --non-interactive || true
              rm -f "$key_file"
            fi
            npx -y firebase-tools target:apply hosting xsign "${XSIGN_FIREBASE_SITE_ID}" --project "${XSIGN_FIREBASE_PROJECT_ID}" || true
            npx -y firebase-tools deploy --project "${XSIGN_FIREBASE_PROJECT_ID}" --only "functions:xsign-ota,hosting:${XSIGN_FIREBASE_SITE_ID}" --non-interactive \
              || npx -y firebase-tools deploy --project "${XSIGN_FIREBASE_PROJECT_ID}" --only "functions:xsign-ota,hosting:xsign" --non-interactive \
              || npx -y firebase-tools deploy --project "${XSIGN_FIREBASE_PROJECT_ID}" --only "functions:xsign-ota,hosting" --non-interactive
          else
            echo "No Firebase Service Account key or FIREBASE_TOKEN found in this run; firebase.json and functions_xsign_ota were linked in the repository."
          fi
        } 2>&1 | tee "$RUNNER_TEMP/xsign-firebase-deploy.log"
    - name: Auto-sync repo.json and XSign Studio to ipablack/repo and verify app sources
      shell: bash
      env:
        DEFAULT_GITHUB_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'XSIGN_REPO_SYNC'
        from pathlib import Path
        import base64, json, os, urllib.error, urllib.request

        token = (
            os.environ.get("INPUT_GITHUB_PAT", "").strip()
            or os.environ.get("GH_PAT", "").strip()
            or os.environ.get("REPO_TOKEN", "").strip()
            or os.environ.get("DEFAULT_GITHUB_TOKEN", "").strip()
        )
        headers = {
            "Accept": "application/vnd.github+json",
            "User-Agent": "XSign-Auto-Linker/1.0",
        }
        if token:
            headers["Authorization"] = f"Bearer {token}"

        def gh_req(method, url, payload=None):
            data = json.dumps(payload).encode("utf-8") if payload is not None else None
            req = urllib.request.Request(url, data=data, headers={**headers, "Content-Type": "application/json"}, method=method)
            return urllib.request.urlopen(req, timeout=15)

        # Check if ipablack/repo has repo.json; if missing and token has permission, create/upload it automatically
        repo_api = "https://api.github.com/repos/ipablack/repo"
        repo_exists = False
        try:
            with gh_req("GET", repo_api) as r:
                repo_exists = (r.status == 200)
        except urllib.error.HTTPError as e:
            if e.code == 404 and token:
                try:
                    with gh_req("POST", "https://api.github.com/user/repos", {"name": "repo", "private": False, "auto_init": True, "description": "XSign Official App Repository"}) as cr:
                        repo_exists = (cr.status in (200, 201))
                        print("Created public repository ipablack/repo automatically.")
                except Exception as ce:
                    print(f"Note: Could not auto-create ipablack/repo with current token ({ce}).")
        except Exception:
            pass

        if repo_exists and token:
            for local_rel, remote_path, msg in [
                ("Tools/repo.json", "repo.json", "Initialize XSign repo.json catalog [skip ci]"),
                ("Tools/XSign_Studio_v2.html", "XSign_Studio.html", "Add XSign Studio control panel [skip ci]"),
            ]:
                local_file = Path(local_rel)
                if not local_file.is_file():
                    continue
                content_url = f"{repo_api}/contents/{remote_path}"
                try:
                    with gh_req("GET", content_url) as r:
                        if r.status == 200:
                            print(f"ipablack/repo already contains {remote_path}; preserving existing remote file.")
                            continue
                except urllib.error.HTTPError as e:
                    if e.code == 404:
                        try:
                            b64 = base64.b64encode(local_file.read_bytes()).decode("ascii")
                            with gh_req("PUT", content_url, {"message": msg, "content": b64, "branch": "main"}) as pr:
                                print(f"Synced {remote_path} to ipablack/repo (status {pr.status}).")
                        except Exception as pe:
                            print(f"Note: Token does not have write scope for ipablack/repo/{remote_path} ({pe}).")
                except Exception:
                    pass

        # Verify local Tools/repo.json structure
        local_catalog = json.loads(Path("Tools/repo.json").read_text(encoding="utf-8"))
        assert "apps" in local_catalog and isinstance(local_catalog["apps"], list)
        raw_sources = (
            local_catalog.get("xsign_config", {}).get("app_control", {}).get("core_sources")
            or local_catalog.get("remote_config", {}).get("core_sources")
            or []
        )
        core_urls = [s.get("url") if isinstance(s, dict) else str(s) for s in raw_sources]
        assert "https://supapi.trystore.net/rest/v1/plus_library_apps" in core_urls
        assert any(u in core_urls for u in (
            "https://raw.githubusercontent.com/ipablack/repo/main/repo.json",
            "https://github.com/ipablack/repo/raw/refs/heads/main/repo.json",
        ))
        print("Verified approved sources in repo.json:", core_urls)
        XSIGN_REPO_SYNC
    - name: Downloadable domain package and setup guide
      uses: actions/upload-artifact@v4
      with:
        name: XSign-Domain-Backend
        path: |
          DomainBackend/
          functions_xsign_ota/
          firebase.json
          .firebaserc
          repo.json
          XSign_Studio.html
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
    - name: Check x-sign.web.app service readiness
      shell: bash
      run: |
        set -euo pipefail
        if python3 DomainBackend/verify.py >"$RUNNER_TEMP/xsign-domain-readiness.log" 2>&1; then
          cat "$RUNNER_TEMP/xsign-domain-readiness.log"
          echo "XSIGN_DOMAIN_LIVE=true" >> "$GITHUB_ENV"
        else
          cat "$RUNNER_TEMP/xsign-domain-readiness.log"
          echo "XSIGN_DOMAIN_LIVE=false" >> "$GITHUB_ENV"
          if [ "${INPUT_REQUIRE_LIVE_DOMAIN:-false}" = "true" ]; then
            echo "require_live_domain=true was set and x-sign.web.app is not live yet."
            exit 1
          fi
          echo "Notice: x-sign.web.app is not live yet; proceeding to link repository files and build X-SIGN.ipa."
        fi
    - name: Upload domain check logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: XSign-Domain-Checks
        path: ${{ runner.temp }}/xsign-*.log
        if-no-files-found: ignore
        retention-days: 14
