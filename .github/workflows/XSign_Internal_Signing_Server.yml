# Upload to .github/workflows/XSign_Internal_Signing_Server.yml in ipablack/X-SIGN.
name: XSign Secure Local Signing
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xsign-secure-local-signing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update-and-build:
    if: github.ref_type == 'branch'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: false
      - name: Install private signing, guarded IPA extraction and approved sources
        shell: bash
        run: |
          python3 - <<'XSIGN_LOCAL_UPDATE'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, os, subprocess, zlib
          raw=zlib.decompress(base64.b64decode(""))
          if hashlib.sha256(raw).hexdigest()!="e66897183272e032e6d1cc675ba836a2b718680ff09440ca0e1648757c0d6bf7": raise SystemExit("Invalid update payload")
          rows=json.loads(raw)
          root=Path.cwd().resolve()
          ready=[]
          for row in rows:
              name=row['path'];rel=PurePosixPath(name)
              if rel.is_absolute() or '..' in rel.parts or not rel.parts or rel.parts[0] not in ['Feather','IDeviceKitten','Zsign','Tools','Makefile','public','Feather.xcodeproj','Feather.xcworkspace']:
                  raise SystemExit('Invalid update path')
              target=root/name
              if any(p.is_symlink() for p in [target,*target.parents]):raise SystemExit('Symlink blocks update: '+name)
              if target.exists() and not target.is_file():raise SystemExit('Invalid target: '+name)
              current=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
              if current==row['after']:continue
              if current not in row['before']:raise SystemExit('Existing source differs; no files were changed: '+name)
              data=row['text'].encode() if row['text'] is not None else None
              if (hashlib.sha256(data).hexdigest() if data is not None else None)!=row['after']:raise SystemExit('Invalid target digest')
              ready.append((target,data))
          for target,data in ready:
              if data is None:target.unlink()
              else:
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          output=Path(os.environ['RUNNER_TEMP'])/'xsign-secure-local-signing-paths.nul'
          stage_paths=[row['path'] for row in rows if (root/row['path']).exists() or subprocess.run(['git','ls-files','--error-unmatch','--',row['path']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0]
          output.write_bytes(b''.join(name.encode()+b'\0' for name in stage_paths))
          print('Applied',len(ready),'reviewed source updates; files remain in their original paths.')
          XSIGN_LOCAL_UPDATE
      - name: Test local HTTP security, IPA extraction and data migration
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 Tools/Tests/prepare_source_selection_checks.py
            swiftc -swift-version 5 -parse-as-library "$RUNNER_TEMP/xsign-source-policy.swift" Feather/Utilities/XSignRESTSource.swift Tools/Tests/xsign_source_selection_checks.swift -o "$RUNNER_TEMP/xsign-source-checks"
            "$RUNNER_TEMP/xsign-source-checks"
            swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignCertificateSelection.swift Tools/Tests/xsign_certificate_selection_checks.swift -o "$RUNNER_TEMP/xsign-certificate-checks"
            "$RUNNER_TEMP/xsign-certificate-checks"
            swiftc -swift-version 5 -parse-as-library Feather/Utilities/XSignPrivateFiles.swift Tools/Tests/xsign_private_storage_checks.swift -o "$RUNNER_TEMP/xsign-private-storage-checks"
            "$RUNNER_TEMP/xsign-private-storage-checks"
            swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceOwnedStaging.swift Tools/Tests/xsign_owned_staging_checks.swift -o "$RUNNER_TEMP/xsign-staging-checks"
            "$RUNNER_TEMP/xsign-staging-checks"
            swiftc -swift-version 5 -parse-as-library IDeviceKitten/Sources/IDeviceSwift/InstallationProxy/IDeviceFileTransfer.swift Tools/Tests/xsign_local_transfer_checks.swift -o "$RUNNER_TEMP/xsign-transfer-checks"
            "$RUNNER_TEMP/xsign-transfer-checks"
            python3 Tools/Tests/check_zsign_provisioning.py
            python3 Tools/Tests/prepare_local_signing_server_checks.py
            python3 Tools/Tests/make_ipa_security_fixtures.py
            XSIGN_IPA_FIXTURES="$RUNNER_TEMP/xsign-ipa-fixtures" swift run --package-path "$RUNNER_TEMP/xsign-local-server-checks" --jobs 2 XSignLocalServerChecks
            git diff --check
          } 2>&1 | tee "$RUNNER_TEMP/xsign-local-checks.log"
      - name: Build and verify the iOS application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          make 2>&1 | tee "$RUNNER_TEMP/xsign-local-build.log"
          python3 - <<'VERIFY_LOCAL_IPA'
          from pathlib import Path
          import zipfile,plistlib
          p=Path('packages/X-SIGN.ipa')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert not any(n.lower().endswith(('.p12','.ipa')) for n in z.namelist()), 'Private signing keys or nested IPA must not be bundled'
              infos=[n for n in z.namelist() if n.startswith('Payload/') and n.count('/')==2 and n.endswith('/Info.plist')]
              assert len(infos)==1
              info=plistlib.loads(z.read(infos[0]))
              executable=infos[0].rsplit('/',1)[0]+'/'+info['CFBundleExecutable']
              assert len(z.read(executable))>4096
          print('Verified the built IPA archive and app executable')
          VERIFY_LOCAL_IPA
      - name: Upload the successful XSign IPA
        uses: actions/upload-artifact@v4
        with:
          name: XSign-Secure-Local-IPA
          path: packages/X-SIGN.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Save tested source changes to the selected branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A --pathspec-from-file="$RUNNER_TEMP/xsign-secure-local-signing-paths.nul" --pathspec-file-nul
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden local signing, protect signing identities and remove IPA export [skip ci]'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Upload verification and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XSign-Security-Checks-And-Build-Logs
          path: |
            ${{ runner.temp }}/xsign-local-checks.log
            ${{ runner.temp }}/xsign-local-build.log
          if-no-files-found: ignore
          retention-days: 14
