# Replace .github/workflows/XSign_Internal_Signing_Server.yml in ipablack/X-SIGN.
# All-in-one workflow: links firebase.json + functions_xsign_ota, deploys DomainBackend when credentials are provided,
# syncs repo.json to ipablack/repo, runs all native & domain checks, builds X-SIGN.ipa, and commits changes.
name: XSign Pairing-Free Local Installation
'on':
  workflow_dispatch:
    inputs:
      firebase_project_id:
        description: 'معرف مشروع Firebase (يُقرأ تلقائياً من firebase.json أو الحساب، الافتراضي xsign-bd088)'
        required: false
        default: 'xsign-bd088'
      firebase_site_id:
        description: 'معرف موقع Firebase Hosting (الافتراضي x-sign)'
        required: false
        default: 'x-sign'
      firebase_credentials_json:
        description: 'اختياري: محتوى ملف Service Account JSON أو FIREBASE_TOKEN للنشر المباشر'
        required: false
        default: ''
      github_pat:
        description: 'اختياري: GitHub Token لمزامنة repo.json تلقائياً مع مستودع ipablack/repo'
        required: false
        default: ''
      require_live_domain:
        description: 'اشتراط استجابة x-sign.web.app الحية قبل بناء الـ IPA (الافتراضي false للسماح بالربط والبناء أولاً)'
        required: false
        default: 'false'
  push:
    branches:
      - main
      - master
    paths:
      - 'firebase.json'
      - 'service-account.json'
      - 'firebase-service-account.json'
      - '.firebaserc'
      - '.github/workflows/XSign_Internal_Signing_Server.yml'
permissions:
  contents: write
concurrency:
  group: xsign-secure-local-signing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INPUT_FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
      INPUT_FIREBASE_SITE_ID: ${{ inputs.firebase_site_id }}
      INPUT_FIREBASE_CREDENTIALS_JSON: ${{ inputs.firebase_credentials_json }}
      INPUT_GITHUB_PAT: ${{ inputs.github_pat }}
      INPUT_REQUIRE_LIVE_DOMAIN: ${{ inputs.require_live_domain }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
    steps:
    - name: Checkout the selected branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}
        fetch-depth: 1
        submodules: false
