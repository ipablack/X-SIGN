<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --surface: #131313; --label: #f6f6f7; --secondary: #b9b9bf; --edge: #303032; --control: #252527; }
  @media (prefers-color-scheme: light) {
    :root { --surface: #fff; --label: #17171a; --secondary: #55555d; --edge: #dedee4; --control: #eeeef3; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .install-card { max-width: 460px; margin: 0 auto; padding: 24px 20px; text-align: center; color: var(--label);
    background: var(--surface); border: 1px solid var(--edge);
    border-radius: 24px; overflow-wrap: anywhere; }
  .install-mark { display: grid; place-items: center; width: 60px; height: 60px; margin: 0 auto 14px;
    background: {{tint}}; border: 1px solid var(--edge); border-radius: 17px; }
  .install-mark svg { width: 40px; height: 40px; }
  .install-card h1 { font-size: 22px; margin: 0 0 7px; font-weight: 750; }
  .install-name { font-weight: 700; font-size: 17px; }
  .install-version { font-size: 13px; margin: 5px 0 0; color: var(--secondary); }
  .install-details { margin: 12px auto 16px; max-width: 310px; line-height: 1.6; font-size: 14px; color: var(--secondary); white-space: pre-line; }
  .install-action { display: block; margin: 8px auto 0; max-width: 265px; background: var(--control); color: var(--label);
    min-height: 44px; padding: 12px 16px; border-radius: 14px; font-weight: 750; text-decoration: none; }
  .install-action:focus-visible { outline: 3px solid #82bcff; outline-offset: 3px; }
  .install-hint { margin: 10px 0 0; font-size: 12px; color: var(--secondary); }
</style>
<main class="install-card" aria-labelledby="install-title">
  <div class="install-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M7 8h9l8 12L37 4l-9 20 10 15H28l-7-11L7 44l10-20L7 8Z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
  <h1 id="install-title">{{heading}}</h1>
  <div class="install-name">{{name}}</div>
  <p class="install-version">{{version}}</p>
  <p class="install-details">{{details}}</p>
  {{action}}
</main>
