<style>
  :root {
    color-scheme: light dark;
    --bg: #05070c;
    --surface: rgba(16, 21, 32, 0.78);
    --surface-2: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);
    --label: #f5f7fb;
    --secondary: #9aa7bd;
    --muted: #6e7d96;
    --tint: {{tint}};
    --btn-text: #ffffff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef3fa;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-2: rgba(15, 28, 52, 0.04);
      --border: rgba(20, 36, 62, 0.10);
      --border-strong: rgba(20, 36, 62, 0.18);
      --label: #0f1c30;
      --secondary: #4a5d7a;
      --muted: #6d7f9c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Arabic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .xsign-stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    overflow: hidden;
    background:
      radial-gradient(90% 55% at 50% -10%, color-mix(in srgb, var(--tint) 34%, transparent), transparent 72%),
      radial-gradient(70% 45% at 85% 100%, color-mix(in srgb, var(--tint) 16%, transparent), transparent 75%),
      var(--bg);
  }
  .install-card {
    position: relative;
    width: 100%;
    max-width: 430px;
    padding: 30px 24px 24px;
    border-radius: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.42),
      inset 0 1px 0 var(--border-strong);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    text-align: center;
    overflow-wrap: anywhere;
  }
  .brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: var(--secondary);
    direction: ltr;
    margin-bottom: 20px;
  }
  .brand-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--tint);
    box-shadow: 0 0 10px var(--tint);
  }
  .install-mark {
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    margin: 0 auto 18px;
    border-radius: 22px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--tint) 92%, #ffffff 8%), color-mix(in srgb, var(--tint) 68%, #000000 32%));
    border: 1px solid rgba(255, 255, 255, 0.24);
    box-shadow:
      0 14px 34px color-mix(in srgb, var(--tint) 42%, transparent),
      inset 0 1px 1px rgba(255, 255, 255, 0.35);
  }
  .install-mark svg {
    width: 46px;
    height: 46px;
    fill: #ffffff;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.28));
  }
  .install-card h1 {
    margin: 0 0 10px;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.3px;
  }
  .meta-row {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .install-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--label);
  }
  .install-version {
    margin: 0;
    padding: 3px 10px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--tint) 18%, transparent);
    border: 1px solid color-mix(in srgb, var(--tint) 38%, transparent);
    color: var(--label);
    font-size: 12px;
    font-weight: 600;
  }
  .install-details {
    margin: 0 0 22px;
    padding: 14px 16px;
    border-radius: 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--secondary);
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
  }
  .install-action {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 50px;
    padding: 13px 20px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--tint), color-mix(in srgb, var(--tint) 75%, #000000 25%));
    color: var(--btn-text);
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 12px 28px color-mix(in srgb, var(--tint) 38%, transparent);
    transition: transform 0.14s ease, filter 0.14s ease;
  }
  .install-action:active {
    transform: scale(0.98);
    filter: brightness(0.95);
  }
  .install-action:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--tint) 70%, #ffffff 30%);
    outline-offset: 3px;
  }
  .trust-foot {
    margin-top: 16px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .trust-foot svg {
    width: 14px;
    height: 14px;
    stroke: var(--tint);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
<div class="xsign-stage">
  <main class="install-card" aria-labelledby="install-title">
    <div class="brand-pill"><span class="brand-dot" aria-hidden="true"></span><span>X-SIGN · IPA BLACK</span></div>
    <div class="install-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <polygon points="31.57,19.61 44.31,19.61 48.63,27.25 63.73,5.69 48.63,31.76 42.75,21.96 35.29,21.96 43.73,38.24 25.49,69.41 41.57,38.24"/>
        <polygon points="74.51,5.69 57.65,39.61 67.45,57.45 53.53,57.45 50,50.20 35.88,69.80 50.20,45.49 55.29,54.71 63.53,54.71 54.71,39.61"/>
      </svg>
    </div>
    <h1 id="install-title">{{heading}}</h1>
    <div class="meta-row">
      <span class="install-name">{{name}}</span>
      <p class="install-version">{{version}}</p>
    </div>
    <p class="install-details">{{details}}</p>
    {{action}}
    <div class="trust-foot">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg>
      <span>توقيع محلي آمن · تحديث مباشر فوق النسخة المثبّتة</span>
    </div>
  </main>
</div>
