<style>
  :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .install-card { max-width: 460px; margin: 0 auto; padding: 24px 20px; text-align: center; color: #fff;
    background: radial-gradient(ellipse at 50% 0%, #003173, #091526 65%, #07090e); border: 1px solid #294768;
    border-radius: 24px; overflow-wrap: anywhere; }
  .install-mark { display: grid; place-items: center; width: 60px; height: 60px; margin: 0 auto 14px;
    background: #003173; border: 1px solid #527aa9; border-radius: 17px; }
  .install-mark svg { width: 40px; height: 40px; }
  .install-card h1 { font-size: 22px; margin: 0 0 7px; font-weight: 750; }
  .install-name { font-weight: 700; font-size: 17px; }
  .install-version { font-size: 13px; margin: 5px 0 0; color: #c7dcfa; }
  .install-details { margin: 12px auto 16px; max-width: 310px; line-height: 1.6; font-size: 14px; color: #d9e6f7; white-space: pre-line; }
  .install-action { display: block; margin: 8px auto 0; max-width: 265px; background: #e9f3ff; color: #003173;
    min-height: 44px; padding: 12px 16px; border-radius: 14px; font-weight: 750; text-decoration: none; }
  .install-action:focus-visible { outline: 3px solid #82bcff; outline-offset: 3px; }
  .install-hint { margin: 10px 0 0; font-size: 12px; color: #c7dcfa; }
</style>
<main class="install-card" aria-labelledby="install-title">
  <div class="install-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M7 8h9l8 12L37 4l-9 20 10 15H28l-7-11L7 44l10-20L7 8Z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
  <h1 id="install-title">{{heading}}</h1>
  <div class="install-name">{{name}}</div>
  <p class="install-version">{{version}}</p>
  <p class="install-details">{{details}}</p>
  {{action}}
</main>
